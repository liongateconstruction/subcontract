<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0d1117"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="LIONGATE"/>
  <title>LIONGATE</title>
  <style>
    :root{
      --bg:#0d1117;--sur:#161b22;--s2:#1c2333;--brd:#30363d;
      --gold:#f0a500;--glt:rgba(240,165,0,.12);
      --green:#2ea043;--grlt:rgba(46,160,67,.12);
      --red:#da3633;--rlt:rgba(218,54,51,.12);
      --blue:#388bfd;--bllt:rgba(56,139,253,.12);
      --purple:#8957e5;--plt:rgba(137,87,229,.12);
      --teal:#2dd4bf;--tlt:rgba(45,212,191,.12);
      --orange:#e8892b;--olt:rgba(232,137,43,.12);
      --text:#e6edf3;--mut:#8b949e;
      --fd:'Bebas Neue',sans-serif;--fm:'IBM Plex Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fm);overflow:hidden}
    #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
    #ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;padding:24px}
    .ll{font-family:var(--fd);font-size:44px;color:var(--gold);letter-spacing:4px}
    .lsub{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-top:-8px}
    .lbox{background:var(--sur);border:1px solid var(--brd);border-radius:16px;padding:24px;width:100%;max-width:320px}
    .ltit{font-family:var(--fd);font-size:20px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
    .lhnt{font-size:10px;color:var(--mut);margin-bottom:16px;line-height:1.5}
    .linp{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:12px;color:var(--text);font-family:var(--fm);font-size:18px;outline:none;text-align:center;letter-spacing:6px;transition:border-color .15s}
    .linp:focus{border-color:var(--gold)}
    .lbtn{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:13px;border-radius:10px;cursor:pointer;margin-top:10px}
    .lvbtn{width:100%;background:transparent;color:var(--mut);border:1px solid var(--brd);font-family:var(--fm);font-size:11px;padding:9px;border-radius:8px;cursor:pointer;margin-top:6px}
    .lerr{color:var(--red);font-size:11px;text-align:center;margin-top:6px;min-height:14px}
    header{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 14px 8px;display:flex;align-items:center;flex-shrink:0}
    .hlog{font-family:var(--fd);font-size:20px;color:var(--gold);letter-spacing:2px;line-height:1}
    .hsub{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
    .hrgt{margin-left:auto;display:flex;align-items:center;gap:6px}
    .rpill{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700}
    .re{background:var(--glt);color:var(--gold)}.rv{background:var(--bllt);color:var(--blue)}
    .hbtn{background:transparent;border:1px solid var(--brd);color:var(--mut);font-size:10px;padding:5px 8px;border-radius:6px;cursor:pointer;font-family:var(--fm)}
    .hbtn-green{border-color:var(--green);color:var(--green)}
    .content{flex:1;overflow-y:auto;padding:12px 14px 90px}
    .content::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
    nav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--brd);display:flex;z-index:90;padding-bottom:env(safe-area-inset-bottom)}
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 2px 5px;cursor:pointer;border:none;background:transparent;color:var(--mut);font-family:var(--fm);font-size:7px;letter-spacing:.3px;text-transform:uppercase;gap:2px;transition:color .15s}
    .nb.active{color:var(--gold)}.nb .ic{font-size:16px;line-height:1}
    .fab{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));right:14px;width:52px;height:52px;background:var(--gold);border:none;border-radius:50%;font-size:26px;color:#0d1117;cursor:pointer;z-index:89;box-shadow:0 4px 18px rgba(240,165,0,.45);display:flex;align-items:center;justify-content:center}
    .card{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px}
    .ctit{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
    .shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .shdr h2{font-family:var(--fd);font-size:20px;letter-spacing:1px}
    .kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .kg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
    .kpi{background:var(--sur);border-radius:10px;padding:10px 11px;border-left:3px solid}
    .klbl{font-size:7px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
    .kval{font-family:var(--fd);font-size:18px;letter-spacing:1px;line-height:1.1}
    .ksub{font-size:8px;color:var(--mut);margin-top:2px}
    .r2{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:11px}
    .r2 .lb{color:var(--mut)}.r2 .vl{font-weight:700}
    .divider{border-top:1px solid var(--brd);margin:8px 0}
    .oprow{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #1c2333}
    .oprow:last-child{border-bottom:none}
    .opbody{flex:1;min-width:0}
    .opdesc{font-size:11px;line-height:1.4}
    .opmeta{font-size:9px;color:var(--mut);margin-top:2px}
    .delbtn{background:none;border:1px solid var(--brd);color:var(--mut);border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;flex-shrink:0}
    .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700}
    .bar{background:var(--s2);border-radius:2px;height:5px;margin-top:5px}
    .barfill{border-radius:2px;height:100%;transition:width .4s}
    .infobox{border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:10px;line-height:1.6;border:1px solid}
    .empty{text-align:center;padding:30px;color:var(--mut);font-size:11px}
    .pcard{background:var(--sur);border-radius:10px;border:1px solid var(--brd);margin-bottom:10px;overflow:hidden}
    .phdr{padding:11px 14px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
    .pname{font-family:var(--fd);font-size:18px;letter-spacing:1px}
    .pbody{padding:10px 14px 12px}
    .sok{background:var(--grlt);border:1px solid var(--green);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:10px;color:var(--green)}
    .sbad{background:var(--rlt);border:1px solid var(--red);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:10px;color:var(--red)}
    .szero{background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:10px;color:var(--mut)}
    .bcard{background:var(--sur);border-radius:10px;border:1px solid var(--teal);margin-bottom:12px;overflow:hidden}
    .bhdr{background:var(--tlt);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
    .bname{font-family:var(--fd);font-size:18px;letter-spacing:1px;color:var(--teal)}
    .bbody{padding:12px 14px}
    .sdiv{background:var(--s2);border-radius:6px;padding:5px 10px;margin:8px 0;font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
    .mbg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
    .mbox{background:var(--sur);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:94vh;overflow-y:auto}
    .mhandle{width:40px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 14px}
    .mtit{font-family:var(--fd);font-size:22px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
    .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    .tcard{border-radius:12px;padding:11px;border:2px solid;cursor:pointer;transition:opacity .15s}
    .tcard .tic{font-size:20px;margin-bottom:4px}.tcard .ttit{font-family:var(--fd);font-size:14px;letter-spacing:1px;margin-bottom:2px}.tcard .tdsc{font-size:9px;color:var(--mut);line-height:1.3}
    .tcard.sel{opacity:1}.tcard:not(.sel){opacity:.4}
    .tc-exp{border-color:var(--red);background:var(--rlt)}
    .tc-inv{border-color:var(--blue);background:var(--bllt)}
    .tc-inc{border-color:var(--green);background:var(--grlt)}
    .tc-per{border-color:var(--purple);background:var(--plt)}
    .tc-ret{border-color:var(--gold);background:var(--glt)}
    .tc-rep{border-color:var(--orange);background:var(--olt)}
    .fg{margin-bottom:12px}
    .fl{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;display:block}
    .fi{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:11px 12px;color:var(--text);font-family:var(--fm);font-size:14px;outline:none;transition:border-color .15s}
    .fi:focus{border-color:var(--gold)}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .fsave{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:14px;border-radius:10px;cursor:pointer;margin-top:10px}
    .fcanc{width:100%;background:transparent;color:var(--mut);border:1px solid var(--brd);font-family:var(--fm);font-size:12px;padding:10px;border-radius:10px;cursor:pointer;margin-top:6px}
    .fedit{background:transparent;border:1px solid var(--brd);color:var(--mut);border-radius:6px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:var(--fm)}
    /* REPORT */
    #rpt{display:none;position:fixed;inset:0;background:#fff;z-index:500;overflow-y:auto}
    #rpt-bar{position:sticky;top:0;background:#fff;border-bottom:2px solid #f0a500;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:1}
    #rpt-bar h1{font-size:18px;color:#f0a500;font-family:sans-serif}
    #rpt-body{padding:16px;font-family:Arial,sans-serif;font-size:13px;color:#222}
    #rpt-body h2{font-size:14px;color:#333;margin:16px 0 8px;border-bottom:2px solid #f0a500;padding-bottom:4px}
    #rpt-body table{width:100%;border-collapse:collapse;margin-bottom:12px}
    #rpt-body th{background:#1a1f2e;color:#f0a500;padding:6px 8px;text-align:left;font-size:11px}
    #rpt-body td{padding:6px 8px;border-bottom:1px solid #eee;font-size:11px}
    #rpt-body tr:nth-child(even) td{background:#f9f9f9}
    .rpt-kpis{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .rpt-kpi{background:#f5f5f5;border-left:3px solid #f0a500;padding:8px 12px;border-radius:4px;min-width:130px}
    .rpt-kpi-l{font-size:9px;color:#888;text-transform:uppercase}
    .rpt-kpi-v{font-size:16px;font-weight:700}
    @media print{#rpt-bar button{display:none}#app,nav,.fab{display:none!important}}
    @media(min-width:600px){.kg{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="ls">
  <div style="text-align:center"><div class="ll">LIONGATE</div><div class="lsub">LionGate Construction</div></div>
  <div class="lbox">
    <div class="ltit">ВХОД</div>
    <div class="lhnt">Введите пароль чтобы вносить данные.<br>Партнёры — просмотр без пароля.</div>
    <input class="linp" type="password" id="lpass" placeholder="••••••" onkeydown="if(event.key==='Enter')tryLogin()"/>
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" onclick="tryLogin()">ВОЙТИ</button>
    <button class="lvbtn" onclick="viewOnly()">Только просмотр →</button>
  </div>
</div>

<!-- REPORT OVERLAY -->
<div id="rpt">
  <div id="rpt-bar">
    <h1 style="font-size:16px;color:#f0a500;font-family:sans-serif;margin:0">📊 LIONGATE — Отчёт</h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="shareReport()" style="background:#2ea043;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:sans-serif">📤 Поделиться</button>
      <button onclick="printReport()" style="background:#f0a500;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:sans-serif">🖨 Печать/PDF</button>
      <button onclick="document.getElementById('rpt').style.display='none'" style="background:#eee;color:#333;border:none;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:sans-serif">✕</button>
    </div>
  </div>
  <div id="rpt-body"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <div>
      <div class="hlog">LIONGATE</div>
      <div class="hsub">ЖК «АЛГАБАС» · SENSATA GROUP</div>
    </div>
    <div class="hrgt">
      <span id="sync-status" style="font-size:9px;color:var(--green)"></span>
      <span class="rpill" id="rpill"></span>
      <button class="hbtn hbtn-green" id="rpt-btn">📋</button>
      <button class="hbtn" onclick="doLogout()">Выйти</button>
    </div>
  </header>
  <div class="content" id="content"></div>
  <button class="fab" id="fab">+</button>
  <nav>
    <button class="nb active" id="tab-main">    <span class="ic">◈</span><span>Сводка</span></button>
    <button class="nb"        id="tab-pl">       <span class="ic">📊</span><span>P&amp;L</span></button>
    <button class="nb"        id="tab-partners"> <span class="ic">👥</span><span>Партнёры</span></button>
    <button class="nb"        id="tab-brigades"> <span class="ic">👷</span><span>Бригады</span></button>
    <button class="nb"        id="tab-cash">     <span class="ic">⇅</span><span>Движение</span></button>
    <button class="nb"        id="tab-journal">  <span class="ic">≡</span><span>Журнал</span></button>
  </nav>
</div>

<!-- MODAL -->
<div class="mbg" id="modal" style="display:none">
  <div class="mbox"><div class="mhandle"></div><div class="mtit" id="mtit">НОВАЯ ЗАПИСЬ</div><div id="mbody"></div></div>
</div>

// AUTH
// ══════════════════════════════════════════════
var PWD={'Intek2026':'editor','Finance2026':'editor'};
var role=null;

function tryLogin(){
  var p=document.getElementById('lpass').value.trim();
  if(PWD[p]){role=PWD[p];sessionStorage.setItem('role',role);showApp();}
  else{document.getElementById('lerr').textContent='Неверный пароль';document.getElementById('lpass').value='';}
}
function viewOnly(){role='viewer';sessionStorage.setItem('role','viewer');showApp();}
function doLogout(){
  sessionStorage.removeItem('role');role=null;
  document.getElementById('app').style.display='none';
  document.getElementById('ls').style.display='flex';
  document.getElementById('lpass').value='';
  document.getElementById('lerr').textContent='';
}
function showApp(){
  document.getElementById('ls').style.display='none';
  document.getElementById('app').style.display='flex';
  var rp=document.getElementById('rpill');
  var fab=document.getElementById('fab');
  if(role==='editor'){rp.textContent='Редактор';rp.className='rpill re';fab.style.display='flex';}

}

// ══════════════════════════════════════════════
// CLOUD SYNC
// ══════════════════════════════════════════════
var API_KEY='$2a$10$GBjOzIGzwTDlm4AZ4NkFS.nQXesYbuM/MNy2EYw4JV/QrDHiZG31m';
var BIN_ID='6a0a38b9c0954111d83ac9f8';
var BIN_URL='https://api.jsonbin.io/v3/b/'+BIN_ID;
var syncTimer=null;

function syncStatus(msg,err){
  var el=document.getElementById('sync-status');
  if(!el)return;
  el.textContent=msg;
  el.style.color=err?'var(--red)':'var(--green)';
  setTimeout(function(){el.textContent='';},3000);
}
function saveToCloud(){
  fetch(BIN_URL,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':API_KEY,'X-Bin-Versioning':'false'},
    body:JSON.stringify({entries:state.entries,brigades:state.brigades})
  }).then(function(){syncStatus('✅',false);}).catch(function(){syncStatus('⚠️',true);});
}
function loadFromCloud(cb){
  syncStatus('🔄',false);
  fetch(BIN_URL,{headers:{'X-Master-Key':API_KEY}})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d&&d.record&&d.record.entries&&d.record.entries.length>0){
      state.entries=d.record.entries;
      if(d.record.brigades&&d.record.brigades.length>0)state.brigades=d.record.brigades;
      try{localStorage.setItem('lg_v1',JSON.stringify(state));}catch(e){}
      syncStatus('✅',false);
    } else if(state.entries.length>0){saveToCloud();}
    if(cb)cb();
  }).catch(function(){syncStatus('⚠️',true);if(cb)cb();});
}

// ══════════════════════════════════════════════
// CALCULATIONS
// ══════════════════════════════════════════════
function fmt(n){return new Intl.NumberFormat('ru').format(Math.abs(Math.round(n||0)));}
function fmtD(n){return new Intl.NumberFormat('ru',{maximumFractionDigits:2}).format(n||0);}
function pColor(name){var i=PARTNERS.indexOf(name);return i>=0?PC[i]:'#8b949e';}
function sumBy(type,field,val){return state.entries.filter(function(e){return e.type===type&&(!field||e[field]===val);}).reduce(function(s,e){return s+e.amount;},0);}
function brigName(id){var b=state.brigades.find(function(x){return x.id===id;});return b?b.name:'';}

function calcCompany(){
  var income=sumBy('income'),expense=sumBy('expense'),invested=sumBy('invest'),returned=sumBy('return'),repaid=sumBy('repay');
  var personal=state.entries.filter(function(e){return e.type==='personal';}).reduce(function(s,e){return s+e.amount;},0);
  var profit=income-expense,owedToDmitry=invested-returned;
  var toShare=Math.max(profit-owedToDmitry,0),shareEach=toShare/5;
  return {income:income,expense:expense,invested:invested,returned:returned,repaid:repaid,personal:personal,profit:profit,owedToDmitry:owedToDmitry,toShare:toShare,shareEach:shareEach};
}
function calcPodotchet(){
  return PARTNERS.map(function(name,i){
    var given=state.entries.filter(function(e){return e.type==='invest'&&e.to===name;}).reduce(function(s,e){return s+e.amount;},0);
    var spent=state.entries.filter(function(e){return e.type==='expense'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
    var personal=state.entries.filter(function(e){return e.type==='personal'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
    var repaid=state.entries.filter(function(e){return e.type==='repay'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
    return {name:name,color:PC[i],given:given,spent:spent,personal:personal,repaid:repaid,onHand:given-spent-personal-repaid};
  }).filter(function(p){return p.given>0;});
}
function calcPartner(name){
  var invested=sumBy('invest','who',name),returned=sumBy('return','who',name);
  var personal=state.entries.filter(function(e){return e.type==='personal'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
  var C=calcCompany();
  var pod=calcPodotchet();
  var myPod=pod.find(function(x){return x.name===name;})||{onHand:0};
  var onHand=Math.max(myPod.onHand,0);
  var mustReturn=personal+onHand;
  return {name:name,invested:invested,returned:returned,personal:personal,onHand:onHand,mustReturn:mustReturn,shareEach:C.shareEach,netPosition:C.shareEach-mustReturn};
}
function calcBrigade(brig){
  var volEntries=state.entries.filter(function(e){return e.type==='vol'&&e.brigade===brig.id;});
  var totalVol=volEntries.reduce(function(s,e){return s+(e.volume||0);},0);
  var totalEarned=volEntries.reduce(function(s,e){return s+e.amount;},0);
  var paid=state.entries.filter(function(e){return (e.type==='pay'||e.type==='expense')&&e.brigade===brig.id;}).reduce(function(s,e){return s+e.amount;},0);
  var history=volEntries.concat(state.entries.filter(function(e){return (e.type==='pay'||e.type==='expense')&&e.brigade===brig.id;})).sort(function(a,b){return b.date.localeCompare(a.date);});
  return {totalVol:totalVol,totalEarned:totalEarned,paid:paid,balance:totalEarned-paid,history:history,volEntries:volEntries};
}

function badge(type){return '<span class="badge" style="color:'+TC[type]+';background:'+TB[type]+'">'+ICO[type]+' '+LBL[type]+'</span>';}
function descOf(e){
  if(e.type==='invest')   return e.who+(e.to?' → '+e.to:'')+': '+e.note;
  if(e.type==='expense')  return e.note+' ['+e.cat+']'+(e.brigade?' · '+brigName(e.brigade):'');
  if(e.type==='income')   return e.note||'Приход от заказчика';
  if(e.type==='personal') return e.who+' взял лично: '+e.note;
  if(e.type==='return')   return 'Возврат вложений → '+e.who;
  if(e.type==='repay')    return e.who+' вернул в кассу: '+e.note;
  if(e.type==='vol')      return brigName(e.brigade)+': '+fmtD(e.volume||0)+' м³ × '+fmt(e.rate||0)+' ₸'+(e.zone?' · '+e.zone:'');
  if(e.type==='pay')      return 'Выплата → '+brigName(e.brigade)+': '+(e.note||'');
  return e.note||'';
}
function opRow(e,showDel){
  return '<div class="oprow">'+
    '<div class="opbody">'+
      '<div style="margin-bottom:3px">'+badge(e.type)+'</div>'+
      '<div class="opdesc">'+descOf(e)+'</div>'+
      '<div class="opmeta">'+e.date+(e.obj&&e.obj!=='-'?' · '+e.obj.split('—')[0].split(',')[0].trim():'')+'</div>'+
    '</div>'+
    '<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+
      '<div style="font-size:13px;font-weight:700;color:'+(TC[e.type]||'var(--mut)')+'">'+fmt(e.amount)+' ₸</div>'+
      (showDel&&role==='editor'?'<button class="delbtn" onclick="delEntry('+e.id+')">✕</button>':'')+
    '</div>'+
  '</div>';
}

      if(podP.personal>0)h+='<div class="r2"><span class="lb">Взял лично</span><span class="vl" style="color:var(--purple)">−'+fmt(podP.personal)+' ₸</span></div>';
      if(podP.repaid>0)h+='<div class="r2"><span class="lb">Вернул в кассу</span><span class="vl" style="color:var(--green)">−'+fmt(podP.repaid)+' ₸</span></div>';
      h+='<div style="border-top:1px solid var(--brd);margin-top:6px;padding-top:6px" class="r2"><span class="lb" style="color:var(--text);font-weight:700">Остаток на руках</span><span class="vl" style="color:'+(podP.onHand>0?'var(--red)':'var(--green)')+';font-size:14px">'+fmt(podP.onHand)+' ₸</span></div>';
      h+='</div>';
    }
    h+='<div style="background:var(--s2);border-radius:8px;padding:10px;margin-bottom:8px">';
    h+='<div style="font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">📊 Доля и личные</div>';
    h+='<div class="r2"><span class="lb">Доля прибыли (1/5)</span><span class="vl" style="color:var(--gold)">'+fmt(C.shareEach)+' ₸</span></div>';
    if(P.personal>0)h+='<div class="r2"><span class="lb">👤 Взял лично</span><span class="vl" style="color:var(--purple)">'+fmt(P.personal)+' ₸</span></div>';
    if(P.onHand>0)h+='<div class="r2"><span class="lb">📤 На руках (вернуть)</span><span class="vl" style="color:var(--red)">'+fmt(P.onHand)+' ₸</span></div>';
    if(P.mustReturn>0){
      h+='<div style="border-top:1px solid var(--brd);margin-top:6px;padding-top:6px" class="r2">';
      h+='<span class="lb" style="color:var(--text);font-weight:700">Всего должен в кассу</span>';
      h+='<span class="vl" style="color:var(--red);font-size:14px">'+fmt(P.mustReturn)+' ₸</span></div>';
    }
    h+='</div>';
    h+='<div style="border-radius:10px;padding:12px;border:2px solid '+fc+';background:'+(totalGet>=0?'var(--grlt)':'var(--rlt)')+'\">';
    h+='<div style="font-size:9px;color:'+fc+';letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">🏁 Итоговый расчёт</div>';
    if(P.invested>0)h+='<div class="r2"><span class="lb">Возврат вложений</span><span class="vl" style="color:var(--blue)">+'+fmt(P.invested-P.returned)+' ₸</span></div>';
    h+='<div class="r2"><span class="lb">Доля прибыли</span><span class="vl" style="color:var(--gold)">+'+fmt(C.shareEach)+' ₸</span></div>';
    if(P.personal>0)h+='<div class="r2"><span class="lb">Взял лично</span><span class="vl" style="color:var(--purple)">−'+fmt(P.personal)+' ₸</span></div>';
    if(P.onHand>0)h+='<div class="r2"><span class="lb">На руках</span><span class="vl" style="color:var(--red)">−'+fmt(P.onHand)+' ₸</span></div>';
    h+='<div style="border-top:2px solid '+fc+';margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;align-items:center">';
    h+='<span style="font-size:12px;font-weight:700;color:'+fc+'">'+(totalGet>=0?'К ПОЛУЧЕНИЮ':'К ВОЗВРАТУ В КАССУ')+'</span>';
    h+='<span style="font-family:var(--fd);font-size:26px;color:'+fc+'">'+fmt(Math.abs(totalGet))+' ₸</span>';
    h+='</div></div></div></div>';
  });
  return h;
}

// ══════════════════════════════════════════════
// RENDER BRIGADES
// ══════════════════════════════════════════════
function renderBrigades(){
  var h='<div class="shdr"><h2>БРИГАДЫ</h2>'+(role==='editor'?'<button class="fedit" onclick="openAddBrigadeModal()" style="color:var(--teal);border-color:var(--teal)">+ Бригада</button>':'')+'</div>';
  h+='<div class="infobox" style="border-color:var(--teal);background:var(--tlt);color:var(--mut)">👷 Начислено = объём (м³) × расценка. Остаток = начислено − выплачено.</div>';
  state.brigades.forEach(function(b){
    var B=calcBrigade(b);
    var bc=B.balance>0?'var(--red)':B.balance<0?'var(--green)':'var(--mut)';
    var btxt=B.balance>0?'Долг: '+fmt(B.balance)+' ₸':B.balance<0?'Переплата: '+fmt(Math.abs(B.balance))+' ₸':'Расчёт закрыт';
    var pct=B.totalEarned?Math.min(Math.round(B.paid/B.totalEarned*100),100):0;
    var rateMap={};
    B.volEntries.forEach(function(e){var k=(e.rate||0)+'_'+(e.zone||'');if(!rateMap[k])rateMap[k]={rate:e.rate||0,zone:e.zone||'',vol:0,earned:0};rateMap[k].vol+=(e.volume||0);rateMap[k].earned+=e.amount;});
    h+='<div class="bcard">';
    h+='<div class="bhdr"><div><div class="bname">'+b.name+'</div><div style="font-size:10px;color:var(--mut)">'+b.spec+' · '+b.obj.split('—')[0].split(',')[0].trim()+'</div></div>';
    if(role==='editor')h+='<button class="fedit" onclick="openEditBrigadeModal(\''+b.id+'\')">✏️</button>';
    h+='</div><div class="bbody">';
    h+='<div class="kg3" style="margin-bottom:10px">';
    h+='<div class="kpi" style="border-color:var(--teal);padding:8px"><div class="klbl">Объём</div><div class="kval" style="font-size:16px;color:var(--teal)">'+fmtD(B.totalVol)+'</div><div class="ksub">м³</div></div>';
    h+='<div class="kpi" style="border-color:var(--gold);padding:8px"><div class="klbl">Начислено</div><div class="kval" style="font-size:16px;color:var(--gold)">'+fmt(B.totalEarned)+'</div><div class="ksub">₸</div></div>';
    h+='<div class="kpi" style="border-color:var(--green);padding:8px"><div class="klbl">Выплачено</div><div class="kval" style="font-size:16px;color:var(--green)">'+fmt(B.paid)+'</div><div class="ksub">₸</div></div>';
    h+='</div>';
    h+='<div class="bar" style="height:7px;margin-bottom:4px"><div class="barfill" style="width:'+pct+'%;background:var(--teal)"></div></div>';
    h+='<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-bottom:10px"><span>выплачено '+pct+'%</span><span style="color:'+bc+';font-weight:700">'+btxt+'</span></div>';
    var rm=Object.values(rateMap);
    if(rm.length){h+='<div class="sdiv">Расценки</div>';rm.forEach(function(r){h+='<div class="r2" style="font-size:10px"><span class="lb">'+(r.zone||'Основной')+' · '+fmt(r.rate)+' ₸/м³</span><span style="color:var(--teal)">'+fmtD(r.vol)+' м³ = '+fmt(r.earned)+' ₸</span></div>';});}
    if(B.history.length){
      h+='<div class="sdiv">История</div>';
      B.history.forEach(function(e){
        h+='<div class="r2" style="font-size:10px"><span class="lb">'+e.date+' · '+(e.type==='vol'?'📐 '+fmtD(e.volume||0)+' м³ × '+fmt(e.rate||0)+' ₸':e.type==='pay'?'💸 Выплата':'💸 Аванс')+(e.zone?' · '+e.zone:'')+(e.note?' · '+e.note:'')+'</span><span style="color:'+(e.type==='vol'?'var(--gold)':'var(--green)')+'">'+fmt(e.amount)+' ₸</span></div>';
      });
    }
    if(role==='editor'){
      h+='<div style="display:flex;gap:8px;margin-top:12px">';
      h+='<button onclick="openVolModal(\''+b.id+'\')" style="flex:1;background:var(--tlt);border:1px solid var(--teal);color:var(--teal);border-radius:8px;padding:9px;font-family:var(--fm);font-size:11px;cursor:pointer">📐 Объём</button>';
      h+='<button onclick="openPayModal(\''+b.id+'\')" style="flex:1;background:var(--grlt);border:1px solid var(--green);color:var(--green);border-radius:8px;padding:9px;font-family:var(--fm);font-size:11px;cursor:pointer">💸 Выплатить</button>';
      h+='</div>';
    }
    h+='</div></div>';
  });
  return h;
}

// ══════════════════════════════════════════════
// RENDER CASH
// ══════════════════════════════════════════════
function renderCash(){
  var sorted=[].concat(state.entries).filter(function(e){return e.type!=='vol';}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var run=0;
  var rows=sorted.map(function(e){var sign=(e.type==='income'||e.type==='invest'||e.type==='repay')?1:-1;run+=sign*e.amount;return {e:e,sign:sign,running:run};}).reverse();
  var h='<div class="shdr"><h2>ДВИЖЕНИЕ</h2><span style="font-size:11px;font-weight:700;color:'+(run>=0?'var(--green)':'var(--red)')+'">касса: '+fmt(run)+' ₸</span></div>';
  h+='<div class="card" style="padding:0 14px">';
  rows.forEach(function(r){
    h+='<div class="oprow"><div class="opbody"><div style="margin-bottom:3px">'+badge(r.e.type)+'</div><div class="opdesc">'+descOf(r.e)+'</div><div class="opmeta">'+r.e.date+(r.e.obj&&r.e.obj!=='-'?' · '+r.e.obj.split('—')[0].split(',')[0].trim():'')+'</div></div>';
    h+='<div style="text-align:right"><div style="font-size:12px;font-weight:700;color:'+(TC[r.e.type]||'var(--mut)')+'">'+(r.sign>0?'+':'-')+fmt(r.e.amount)+' ₸</div>';
    h+='<div style="font-size:9px;color:'+(r.running>=0?'var(--mut)':'var(--red)')+'">ост: '+fmt(r.running)+' ₸</div></div></div>';
  });
  h+='</div>';
  return h;
}

// ══════════════════════════════════════════════
// RENDER JOURNAL
// ══════════════════════════════════════════════
function renderJournal(){
  var sorted=[].concat(state.entries).sort(function(a,b){return b.date.localeCompare(a.date);});
  var h='<div class="shdr"><h2>ЖУРНАЛ</h2><span style="font-size:11px;color:var(--mut)">'+sorted.length+' записей</span></div>';
  h+='<div class="card" style="padding:0 14px">';
  h+=sorted.length?sorted.map(function(e){return opRow(e,true);}).join(''):'<div class="empty">Нет записей</div>';
  h+='</div>';
  return h;
}

// ══════════════════════════════════════════════
// REPORT — ПОЛНЫЙ ДЕТАЛЬНЫЙ ОТЧЁТ
// ══════════════════════════════════════════════
function showReport(){
  var C=calcCompany();
  var pod=calcPodotchet();
  var date=new Date().toLocaleDateString('ru-RU');

  function row(cells,bold){
    return '<tr>'+cells.map(function(c,i){
      return '<td style="padding:6px 8px;border-bottom:1px solid #eee;font-size:11px'+(bold?';font-weight:700':'')+'">'+(c===null||c===undefined?'—':c)+'</td>';
    }).join('')+'</tr>';
  }
  function hrow(cells){
    return '<tr>'+cells.map(function(c){return '<th style="background:#1a1f2e;color:#f0a500;padding:7px 8px;text-align:left;font-size:11px">'+c+'</th>';}).join('')+'</tr>';
  }
  function section(title){
    return '<h2 style="font-size:15px;color:#1a1f2e;margin:20px 0 8px;padding-bottom:6px;border-bottom:3px solid #f0a500;font-family:Arial,sans-serif">'+title+'</h2>';
  }
  function kpi(label,value,color){
    return '<div style="display:inline-block;background:#f8f9fa;border-left:4px solid '+(color||'#f0a500')+';padding:10px 14px;margin:4px;border-radius:4px;min-width:150px;vertical-align:top">'+
      '<div style="font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">'+label+'</div>'+
      '<div style="font-size:17px;font-weight:700;color:'+(color||'#f0a500')+'">'+value+'</div>'+
    '</div>';
  }

  var catMap={};
  state.entries.filter(function(e){return e.type==='expense';}).forEach(function(e){catMap[e.cat]=(catMap[e.cat]||0)+e.amount;});

  var h='<style>body{font-family:Arial,sans-serif;font-size:12px;color:#222;padding:0;margin:0}table{width:100%;border-collapse:collapse}@media print{#rpt-bar{display:none}}</style>';

  // ── 1. ШАПКА ──
  h+='<div style="background:#1a1f2e;color:#f0a500;padding:16px 20px;margin-bottom:16px">';
  h+='<div style="font-size:24px;font-weight:700;letter-spacing:2px">LIONGATE</div>';
  h+='<div style="font-size:11px;color:#aaa;margin-top:2px">LionGate Construction · ЖК «Алгабас», Мкр. Нуркент · Sensata Group</div>';
  h+='<div style="font-size:11px;color:#aaa;margin-top:2px">Отчёт сформирован: '+date+'</div>';
  h+='</div>';

  // ── 2. КЛЮЧЕВЫЕ ПОКАЗАТЕЛИ ──
  h+=section('1. КЛЮЧЕВЫЕ ПОКАЗАТЕЛИ');
  h+='<div style="margin-bottom:12px">';
  h+=kpi('Доходы от заказчика',fmt(C.income)+' ₸','#2ea043');
  h+=kpi('Расходы компании',fmt(C.expense)+' ₸','#da3633');
  h+=kpi('Прибыль / убыток',fmt(C.profit)+' ₸',C.profit>=0?'#2ea043':'#da3633');
  h+=kpi('Вложил Дмитрий',fmt(C.invested)+' ₸','#388bfd');
  h+=kpi('Вернуть Дмитрию',fmt(C.owedToDmitry)+' ₸','#388bfd');
  h+=kpi('Доля каждого партнёра',fmt(C.shareEach)+' ₸','#f0a500');
  h+='</div>';

  // ── 3. P&L ──
  h+=section('2. P&L — ДОХОДЫ И РАСХОДЫ');
  h+='<table>'+hrow(['Статья','Тип','Сумма (₸)','% от расходов']);
  h+=row(['ДОХОДЫ','','',''],true);
  h+=row(['Доходы от заказчика','Приход',fmt(C.income)+' ₸','100%']);
  h+=row(['РАСХОДЫ','','',''],true);
  Object.entries(catMap).sort(function(a,b){return b[1]-a[1];}).forEach(function(cv){
    h+=row([cv[0],'Расход',fmt(cv[1])+' ₸',C.expense?Math.round(cv[1]/C.expense*100)+'%':'—']);
  });
  h+=row(['ИТОГО РАСХОДЫ','',fmt(C.expense)+' ₸','100%'],true);
  h+=row(['ПРИБЫЛЬ / УБЫТОК','',fmt(C.profit)+' ₸',''],true);
  h+='</table>';

  // ── 4. ПАРТНЁРЫ ДЕТАЛЬНО ──
  h+=section('3. ПАРТНЁРЫ — ДЕТАЛЬНЫЙ РАСЧЁТ');
  h+='<table>'+hrow(['Партнёр','Вложил (₸)','Возвращено (₸)','Ещё вернуть (₸)','Взял лично (₸)','На руках (₸)','Всего долг (₸)','Доля прибыли (₸)','К получению (₸)','Статус']);
  PARTNERS.forEach(function(p,i){
    var P=calcPartner(p);
    var podP=pod.find(function(x){return x.name===p;})||{onHand:0};
    var totalGet=C.shareEach+(P.invested-P.returned)-P.mustReturn;
    var status=totalGet>0?'✅ Получит '+fmt(totalGet)+' ₸':totalGet<0?'⚠️ Вернёт '+fmt(Math.abs(totalGet))+' ₸':'✓ Закрыт';
    h+='<tr>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;font-weight:700;color:'+PC[i]+'">'+p+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#388bfd">'+fmt(P.invested)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#2ea043">'+fmt(P.returned)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#388bfd">'+fmt(P.invested-P.returned)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#8957e5">'+fmt(P.personal)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:'+(podP.onHand>0?'#da3633':'#2ea043')+'">'+fmt(Math.max(podP.onHand,0))+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#da3633">'+fmt(P.mustReturn)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#f0a500">'+fmt(C.shareEach)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:'+(totalGet>=0?'#2ea043':'#da3633')+'">'+fmt(Math.abs(totalGet))+(totalGet>=0?' ↑':' ↓')+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;font-size:10px">'+status+'</td>';
    h+='</tr>';
  });
  h+='</table>';

  // ── 5. ПОДОТЧЁТ ──
  h+=section('4. ПОДОТЧЁТ — КТО СКОЛЬКО ДЕРЖИТ НА РУКАХ');
  h+='<table>'+hrow(['Сотрудник','Получил наличными (₸)','Потратил на компанию (₸)','Взял лично (₸)','Вернул в кассу (₸)','Остаток на руках (₸)','Статус']);
  pod.forEach(function(p){
    var status=p.onHand>0?'⚠️ Должен вернуть '+fmt(p.onHand)+' ₸':p.onHand<0?'↩ Переплата '+fmt(Math.abs(p.onHand))+' ₸':'✅ Чисто';
    h+='<tr>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;font-weight:700;color:'+p.color+'">'+p.name+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right">'+fmt(p.given)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#da3633">'+fmt(p.spent)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#8957e5">'+fmt(p.personal)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;color:#2ea043">'+fmt(p.repaid)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right;font-weight:700;color:'+(p.onHand>0?'#da3633':'#2ea043')+'">'+fmt(p.onHand)+'</td>';
    h+='<td style="padding:6px 8px;border-bottom:1px solid #eee;font-size:10px">'+status+'</td>';
    h+='</tr>';
  });
  h+='</table>';

  // ── 6. БРИГАДЫ ──
  h+=section('5. БРИГАДЫ — ДЕТАЛЬНЫЙ УЧЁТ');
  state.brigades.forEach(function(b){
    var B=calcBrigade(b);
    h+='<div style="background:#f0faf8;border:1px solid #2dd4bf;border-radius:6px;padding:10px 14px;margin-bottom:8px">';
    h+='<div style="font-weight:700;font-size:14px;color:#1a1f2e">'+b.name+' <span style="font-size:11px;color:#888;font-weight:400">· '+b.spec+'</span></div>';
    h+='<div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">';
    h+='<span style="font-size:11px">Объём: <b>'+fmtD(B.totalVol)+' м³</b></span>';
    h+='<span style="font-size:11px">Начислено: <b style="color:#f0a500">'+fmt(B.totalEarned)+' ₸</b></span>';
    h+='<span style="font-size:11px">Выплачено: <b style="color:#2ea043">'+fmt(B.paid)+' ₸</b></span>';
    h+='<span style="font-size:11px">Остаток: <b style="color:'+(B.balance>0?'#da3633':'#2ea043')+'">'+fmt(B.balance)+' ₸</b></span>';
    h+='</div></div>';
    if(B.volEntries.length){
      h+='<table style="margin-bottom:12px">'+hrow(['Дата','Пятно/зона','Объём (м³)','Расценка (₸/м³)','Начислено (₸)','Примечание']);
      B.volEntries.sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
        h+=row([e.date,e.zone||'Основной',fmtD(e.volume||0),fmt(e.rate||0),fmt(e.amount),e.note||'—']);
      });
      h+='</table>';
    }
    var pays=state.entries.filter(function(e){return (e.type==='pay'||e.type==='expense')&&e.brigade===b.id;});
    if(pays.length){
      h+='<div style="font-size:11px;color:#888;margin-bottom:4px">Выплаты и авансы:</div>';
      h+='<table style="margin-bottom:16px">'+hrow(['Дата','Тип','Сумма (₸)','Примечание']);
      pays.sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
        h+=row([e.date,e.type==='pay'?'💸 Выплата':'💸 Аванс',fmt(e.amount),e.note||'—']);
      });
      h+='</table>';
    }
  });

function shareReport(){
  var content=document.getElementById('rpt-body').innerHTML;

  var full='<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>'+
    '<title>LIONGATE Отчёт '+date+'</title>'+
    '<style>body{font-family:Arial,sans-serif;font-size:11px;color:#222;padding:16px;max-width:900px;margin:0 auto}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:12px}'+
    'th{background:#1a1f2e;color:#f0a500;padding:6px 8px;text-align:left;font-size:10px}'+
    'td{padding:5px 8px;border-bottom:1px solid #eee;font-size:10px}'+

    '</style></head><body>'+content+'</body></html>';
  var blob=new Blob([full],{type:'text/html;charset=utf-8'});
  // Try Web Share API first (works on mobile)
  if(navigator.share&&navigator.canShare){
    var file=new File([blob],'LIONGATE_'+date.replace(/\./g,'-')+'.html',{type:'text/html'});
    if(navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'LIONGATE Отчёт '+date}).catch(function(){printReport();});
      return;
    }
  }
  // Fallback to print
  printReport();
}

function saveEntry(){
  var amount=parseFloat(document.getElementById('f-amount')&&document.getElementById('f-amount').value);
  if(!amount||isNaN(amount)){alert('Введите сумму');return;}
  var e={id:Date.now(),date:(document.getElementById('f-date')&&document.getElementById('f-date').value)||new Date().toISOString().slice(0,10),type:selType,amount:amount,note:(document.getElementById('f-note')&&document.getElementById('f-note').value)||''};
  if(selType==='expense'){e.obj=g('f-obj')||OBJECTS[0];e.cat=g('f-cat')||'';e.who=g('f-who')||'';var bv=g('f-brig');if(bv)e.brigade=bv;}
  if(selType==='invest'){e.who=g('f-who')||'';e.obj=OBJECTS[0];var tv=g('f-to');e.to=tv||'';}
  if(selType==='income'){e.obj=g('f-obj')||OBJECTS[0];e.from=g('f-from')||'';}
  if(selType==='personal'){e.who=g('f-who')||'';e.obj='-';}
  if(selType==='return'){e.who=g('f-who')||'';e.obj='-';}
  if(selType==='repay'){e.who=g('f-who')||'';e.obj='-';}
  state.entries.push(e);save();closeModal();render();
}
function g(id){var el=document.getElementById(id);return el?el.value:'';}

function openVolModal(brigId){

  document.getElementById('mtit').textContent='📐 ОБЪЁМ РАБОТ';
  document.getElementById('mbody').innerHTML='<div style="background:var(--tlt);border:1px solid var(--teal);border-radius:8px;padding:10px;margin-bottom:14px;font-size:11px;color:var(--teal)">'+b.name+' · '+b.spec+'<br>Сумма = Объём × Расценка</div><div class="frow"><div class="fg"><label class="fl">Дата</label><input class="fi" id="f-date" type="date" value="'+today+'"/></div><div class="fg"><label class="fl">Объём (м³)</label><input class="fi" id="f-vol" type="number" placeholder="0.00" step="0.01" inputmode="decimal" oninput="calcVolPrev()"/></div></div><div class="frow"><div class="fg"><label class="fl">Расценка (₸/м³)</label><input class="fi" id="f-rate" type="number" placeholder="'+(b.rate||0)+'" value="'+(b.rate||'')+'" inputmode="numeric" oninput="calcVolPrev()"/></div><div class="fg"><label class="fl">Пятно / зона</label><input class="fi" id="f-zone" type="text" placeholder="Пятно А..."/></div></div><div class="fg"><label class="fl">Примечание</label><input class="fi" id="f-note" type="text" placeholder="Колонны, перекрытия..."/></div><div style="background:var(--s2);border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px;color:var(--mut)" id="vol-prev">Введите объём и расценку</div><button class="fsave" style="background:var(--teal)" onclick="saveVol(\''+brigId+'\')">СОХРАНИТЬ</button><button class="fcanc" onclick="closeModal()">Отмена</button>';
  document.getElementById('modal').style.display='flex';
}
function calcVolPrev(){var vol=parseFloat(g('f-vol'))||0,rate=parseFloat(g('f-rate'))||0,sum=vol*rate;var el=document.getElementById('vol-prev');if(el)el.innerHTML='<span style="color:var(--teal)">'+fmtD(vol)+' м³ × '+fmt(rate)+' ₸/м³ = <b style="font-size:14px">'+fmt(sum)+' ₸</b></span>';}
function saveVol(brigId){
  var vol=parseFloat(g('f-vol')),rate=parseFloat(g('f-rate'));
  if(!vol||isNaN(vol)){alert('Введите объём');return;}
  if(!rate||isNaN(rate)){alert('Введите расценку');return;}
  var e={id:Date.now(),date:g('f-date')||new Date().toISOString().slice(0,10),type:'vol',brigade:brigId,volume:vol,rate:rate,amount:Math.round(vol*rate),zone:g('f-zone')||'',note:g('f-note')||'',obj:OBJECTS[0]};
  state.entries.push(e);
  var brig=state.brigades.find(function(x){return x.id===brigId;});if(brig)brig.rate=rate;
  save();closeModal();render();
}

  var b=state.brigades.find(function(x){return x.id===brigId;}),B=calcBrigade(b);

function savePay(brigId){
  var amount=parseFloat(g('f-amount'));if(!amount||isNaN(amount)){alert('Введите сумму');return;}
  var e={id:Date.now(),date:g('f-date')||new Date().toISOString().slice(0,10),type:'pay',brigade:brigId,amount:amount,note:g('f-note')||'',obj:OBJECTS[0]};

function openAddBrigadeModal(){
  var objOpts=OBJECTS.map(function(o){return '<option>'+o+'</option>';}).join('');

  document.getElementById('modal').style.display='flex';
}
function saveBrigade(){
  var name=g('f-bname').trim();if(!name){alert('Введите название');return;}
  state.brigades.push({id:'b'+Date.now(),name:name,spec:g('f-bspec')||'',obj:g('f-bobj')||OBJECTS[0],rate:parseFloat(g('f-brate'))||0,unit:'м³'});
  save();closeModal();render();
}
function openEditBrigadeModal(brigId){
  var b=state.brigades.find(function(x){return x.id===brigId;});
  var objOpts=OBJECTS.map(function(o){return '<option'+(o===b.obj?' selected':'')+'>'+o+'</option>';}).join('');
  document.getElementById('mtit').textContent='✏️ РЕДАКТИРОВАТЬ';
  document.getElementById('mbody').innerHTML='<div class="fg"><label class="fl">Название</label><input class="fi" id="f-bname" type="text" value="'+b.name+'"/></div><div class="fg"><label class="fl">Специализация</label><input class="fi" id="f-bspec" type="text" value="'+b.spec+'"/></div><div class="fg"><label class="fl">Объект</label><select class="fi" id="f-bobj">'+objOpts+'</select></div><div class="fg"><label class="fl">Расценка (₸/м³)</label><input class="fi" id="f-brate" type="number" value="'+(b.rate||0)+'" inputmode="numeric"/></div><button class="fsave" style="background:var(--teal)" onclick="updateBrigade(\''+brigId+'\')">СОХРАНИТЬ</button><button class="fcanc" style="color:var(--red);border-color:var(--red)" onclick="deleteBrigade(\''+brigId+'\')">Удалить</button><button class="fcanc" onclick="closeModal()">Отмена</button>';
  document.getElementById('modal').style.display='flex';
}
function updateBrigade(brigId){
  var b=state.brigades.find(function(x){return x.id===brigId;});if(!b)return;
  b.name=g('f-bname').trim()||b.name;b.spec=g('f-bspec')||b.spec;b.obj=g('f-bobj')||b.obj;b.rate=parseFloat(g('f-brate'))||b.rate;
  save();closeModal();render();
}
function deleteBrigade(brigId){
  if(!confirm('Удалить бригаду?'))return;
  state.brigades=state.brigades.filter(function(x){return x.id!==brigId;});
  save();closeModal();render();
}
function delEntry(id){
  if(role!=='editor')return;
  if(!confirm('Удалить запись?'))return;
  state.entries=state.entries.filter(function(e){return e.id!==id;});
  save();render();
}

  document.getElementById('tab-main').addEventListener('click',function(){setTab('main');});

  document.getElementById('tab-partners').addEventListener('click',function(){setTab('partners');});
  document.getElementById('tab-brigades').addEventListener('click',function(){setTab('brigades');});
  document.getElementById('tab-cash').addEventListener('click',function(){setTab('cash');});
  document.getElementById('tab-journal').addEventListener('click',function(){setTab('journal');});
  // FAB
  document.getElementById('fab').addEventListener('click',function(){openModal();});
  // Report button
  document.getElementById('rpt-btn').addEventListener('click',function(){showReport();});
  // Modal close on background
  document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
  // Auto-refresh every 30s
  setInterval(function(){if(role){loadFromCloud(function(){render();});}},30000);
  // Check session
  var sr=sessionStorage.getItem('role');
  if(sr){role=sr;showApp();}
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
