<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>

<style>
:root{
  --bg:#0d1117;--sur:#161b22;--s2:#1c2333;--brd:#30363d;
  --gold:#f0a500;--glt:rgba(240,165,0,.12);
  --green:#2ea043;--grlt:rgba(46,160,67,.12);
  --red:#da3633;--rlt:rgba(218,54,51,.12);
  --blue:#388bfd;--bllt:rgba(56,139,253,.12);
  --purple:#8957e5;--plt:rgba(137,87,229,.12);
  --teal:#2dd4bf;--tlt:rgba(45,212,191,.12);
  --orange:#e8892b;--olt:rgba(232,137,43,.12);
  --text:#e6edf3;--mut:#8b949e;
  --fd:'Bebas Neue',sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fm);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;padding:24px}
.ll{font-family:var(--fd);font-size:44px;color:var(--gold);letter-spacing:4px}
.lsub{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-top:-8px}
.lbox{background:var(--sur);border:1px solid var(--brd);border-radius:16px;padding:24px;width:100%;max-width:320px}
.ltit{font-family:var(--fd);font-size:20px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.lhnt{font-size:10px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.linp{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:12px;color:var(--text);font-family:var(--fm);font-size:18px;outline:none;text-align:center;letter-spacing:6px}
.linp:focus{border-color:var(--gold)}
.lbtn{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:13px;border-radius:10px;cursor:pointer;margin-top:10px}
.lvbtn{width:100%;background:transparent;color:var(--mut);border:1px solid var(--brd);font-family:var(--fm);font-size:11px;padding:9px;border-radius:8px;cursor:pointer;margin-top:6px}
.lerr{color:var(--red);font-size:11px;text-align:center;margin-top:6px;min-height:14px}
header{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 14px 8px;display:flex;align-items:center;flex-shrink:0}
.hlog{font-family:var(--fd);font-size:20px;color:var(--gold);letter-spacing:2px;line-height:1}
.hsub{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.hrgt{margin-left:auto;display:flex;align-items:center;gap:5px}
.rpill{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700}
.re{background:var(--glt);color:var(--gold)}.rv{background:var(--bllt);color:var(--blue)}
.hbtn{background:transparent;border:1px solid var(--brd);color:var(--mut);font-size:10px;padding:5px 8px;border-radius:6px;cursor:pointer;font-family:var(--fm)}
.content{flex:1;overflow-y:auto;padding:12px 14px 90px}
.content::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--brd);display:flex;z-index:90;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 1px 5px;cursor:pointer;border:none;background:transparent;color:var(--mut);font-family:var(--fm);font-size:6px;letter-spacing:.3px;text-transform:uppercase;gap:1px;transition:color .15s}
.nb.active{color:var(--gold)}.nb .ic{font-size:15px;line-height:1}
.fab{position:fixed;bottom:calc(60px + env(safe-area-inset-bottom));right:14px;width:52px;height:52px;background:var(--gold);border:none;border-radius:50%;font-size:26px;color:#0d1117;cursor:pointer;z-index:89;box-shadow:0 4px 18px rgba(240,165,0,.45);display:flex;align-items:center;justify-content:center}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px}
.ctit{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shdr h2{font-family:var(--fd);font-size:20px;letter-spacing:1px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.kpi{background:var(--sur);border-radius:10px;padding:10px 11px;border-left:3px solid}
.klbl{font-size:7px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.kval{font-family:var(--fd);font-size:18px;letter-spacing:1px;line-height:1.1}
.ksub{font-size:8px;color:var(--mut);margin-top:2px}
.r2{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:11px}
.r2 .lb{color:var(--mut)}.r2 .vl{font-weight:700}
.divider{border-top:1px solid var(--brd);margin:8px 0}
.oprow{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #1c2333}
.oprow:last-child{border-bottom:none}
.opbody{flex:1;min-width:0}
.opdesc{font-size:11px;line-height:1.4}
.opmeta{font-size:9px;color:var(--mut);margin-top:2px}
.delbtn{background:none;border:1px solid var(--brd);color:var(--mut);border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;flex-shrink:0}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700}
.bar{background:var(--s2);border-radius:2px;height:5px;margin-top:5px}
.barfill{border-radius:2px;height:100%;transition:width .4s}
.empty{text-align:center;padding:30px;color:var(--mut);font-size:11px}
.pcard{background:var(--sur);border-radius:10px;border:1px solid var(--brd);margin-bottom:10px;overflow:hidden}
.phdr{padding:11px 14px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.pname{font-family:var(--fd);font-size:18px;letter-spacing:1px}
.pbody{padding:10px 14px 12px}
.bcard{background:var(--sur);border-radius:10px;border:1px solid var(--teal);margin-bottom:12px;overflow:hidden}
.bhdr{background:var(--tlt);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.bname{font-family:var(--fd);font-size:18px;letter-spacing:1px;color:var(--teal)}
.bbody{padding:12px 14px}
.sdiv{background:var(--s2);border-radius:6px;padding:5px 10px;margin:8px 0;font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.mbox{background:var(--sur);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:94vh;overflow-y:auto}
.mhandle{width:40px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 14px}
.mtit{font-family:var(--fd);font-size:22px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tcard{border-radius:12px;padding:12px;border:2px solid;cursor:pointer;transition:opacity .15s;text-align:left}
.tcard .tic{font-size:22px;margin-bottom:5px}
.tcard .ttit{font-family:var(--fd);font-size:15px;letter-spacing:1px;margin-bottom:3px}
.tcard .tdsc{font-size:9px;color:var(--mut);line-height:1.4}
.tcard.sel{opacity:1}.tcard:not(.sel){opacity:.4}
.tc-income {border-color:var(--green); background:var(--grlt)}
.tc-invest {border-color:var(--blue);  background:var(--bllt)}
.tc-expense{border-color:var(--red);   background:var(--rlt)}
.tc-personal{border-color:var(--purple);background:var(--plt)}
.tc-return {border-color:var(--gold);  background:var(--glt)}
.fg{margin-bottom:12px}
.fl{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;display:block}
.fi{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:11px 12px;color:var(--text);font-family:var(--fm);font-size:14px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fsave{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:14px;border-radius:10px;cursor:pointer;margin-top:10px}
.fcanc{width:100%;background:transparent;color:var(--mut);border:1px solid var(--brd);font-family:var(--fm);font-size:12px;padding:10px;border-radius:10px;cursor:pointer;margin-top:6px}
.fedit{background:transparent;border:1px solid var(--brd);color:var(--mut);border-radius:6px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:var(--fm)}
.photo-area{border:2px dashed var(--brd);border-radius:8px;padding:14px;text-align:center;cursor:pointer;color:var(--mut);font-size:11px;transition:border-color .15s}
.photo-area:active{border-color:var(--gold)}
.photo-prev{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:8px;display:none}
.photo-thumb{max-height:70px;border-radius:6px;cursor:pointer;margin-top:4px}
#rpt{display:none;position:fixed;inset:0;background:#fff;z-index:500;overflow-y:auto}
#rpt-bar{position:sticky;top:0;background:#fff;border-bottom:2px solid #f0a500;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:1;gap:6px;flex-wrap:wrap}
#rpt-bar h1{font-size:16px;color:#f0a500;font-family:Arial,sans-serif;margin:0}
#rpt-body{padding:16px;font-family:Arial,sans-serif;font-size:12px;color:#222}
#rpt-body h2{font-size:13px;color:#1a1f2e;margin:16px 0 6px;padding-bottom:4px;border-bottom:3px solid #f0a500}
#rpt-body table{width:100%;border-collapse:collapse;margin-bottom:12px}
#rpt-body th{background:#1a1f2e;color:#f0a500;padding:6px 8px;text-align:left;font-size:10px}
#rpt-body td{padding:5px 8px;border-bottom:1px solid #eee;font-size:10px}
#rpt-body tr:nth-child(even) td{background:#f9f9f9}
@media print{#rpt-bar{display:none}#app,nav,.fab{display:none!important}#rpt{display:block!important}}
#pv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;align-items:center;justify-content:center;padding:20px}
@media(min-width:600px){.kg{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div id="ls">
  <div style="text-align:center"><div class="ll">LIONGATE</div><div class="lsub">LionGate Construction</div></div>

    <div class="ltit">ВХОД</div>

<div id="app" style="display:none">

</div>

<script>
'use strict';

// ══════════════════════════════════════════
// ТИПЫ ОПЕРАЦИЙ — 5 штук, просто и понятно
// ══════════════════════════════════════════
/*
  income   💰 Приход         — пришли деньги от заказчика
  invest   💼 Вложил партнёр — партнёр вложил СВОИ деньги в компанию
                               (деньги попали в кассу)
  expense  🧾 Расход          — компания потратила деньги из кассы
                               (кто потратил — не важно, важно что ИЗ КАССЫ)
  personal 👤 Взял лично      — партнёр взял из кассы СЕБЕ (долг из доли)
  return   🔄 Возврат         — вернули партнёру его вложения
*/

var TYPES = {
  income:  {ico:'💰', lbl:'Приход от заказчика', color:'var(--green)',  bg:'var(--grlt)'},
  invest:  {ico:'💼', lbl:'Вложил партнёр',       color:'var(--blue)',   bg:'var(--bllt)'},
  expense: {ico:'🧾', lbl:'Расход компании',       color:'var(--red)',    bg:'var(--rlt)'},
  personal:{ico:'👤', lbl:'Взял лично',            color:'var(--purple)', bg:'var(--plt)'},
  return:  {ico:'🔄', lbl:'Возврат вложений',      color:'var(--gold)',   bg:'var(--glt)'},
};

var PARTNERS = ['Дмитрий','Бекжан','Евгений','Нурсултан','Сергей'];
var PC = ['#f0a500','#2ea043','#388bfd','#8957e5','#da3633'];

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
var PWD = {'Intek2026':'editor','Finance2026':'editor'};
var role = null;

// ══════════════════════════════════════════
// CLOUD SYNC
// ══════════════════════════════════════════
var AK  = '$2a$10$GBjOzIGzwTDlm4AZ4NkFS.nQXesYbuM/MNy2EYw4JV/QrDHiZG31m';
var BIN = '6a0a38b9c0954111d83ac9f8';
var BURL= 'https://api.jsonbin.io/v3/b/'+BIN;
var syncT = null;

function ss(msg,err){
  var el=document.getElementById('sync-st');
  if(!el)return;
  el.textContent=msg;
  el.style.color=err?'var(--red)':'var(--green)';
  setTimeout(function(){el.textContent='';},3000);
}
function pushCloud(){
  fetch(BURL,{method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':AK,'X-Bin-Versioning':'false'},
    body:JSON.stringify({entries:S.entries,brigades:S.brigades,objects:S.objects,history:S.history})
  }).then(function(){ss('✅',false);}).catch(function(){ss('⚠️',true);});
}
function pullCloud(cb){
  ss('🔄',false);
  fetch(BURL,{headers:{'X-Master-Key':AK}})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d&&d.record){
      var r=d.record;
      if(r.entries  &&r.entries.length>0)  S.entries  =r.entries;
      if(r.brigades &&r.brigades.length>0) S.brigades =r.brigades;
      if(r.objects  &&r.objects.length>0)  S.objects  =r.objects;
      if(r.history)S.history=r.history;
      persist();ss('✅',false);
    } else {
      if(S.entries.length>0)pushCloud();
    }
    if(cb)cb();
  }).catch(function(){ss('⚠️',true);if(cb)cb();});
}

function fmt(n){return new Intl.NumberFormat('ru').format(Math.abs(Math.round(n||0)));}
function fmtD(n){return new Intl.NumberFormat('ru',{maximumFractionDigits:2}).format(n||0);}
function pCol(name){var i=PARTNERS.indexOf(name);return i>=0?PC[i]:'#8b949e';}
function bName(id){var b=S.brigades.find(function(x){return x.id===id;});return b?b.name:'';}
function sumT(type,field,val){
  return S.entries.filter(function(e){
    return e.type===type&&(!field||e[field]===val);
  }).reduce(function(s,e){return s+e.amount;},0);
}
function g(id){var el=document.getElementById(id);return el?el.value:'';}

function calcCo(){
  var income   = sumT('income');
  var expense  = sumT('expense');
  var invested = sumT('invest');   // все вложения всех партнёров
  var returned = sumT('return');
  var personal = sumT('personal');
  var profit   = income - expense;
  var owed     = invested - returned;         // сколько ещё вернуть партнёрам
  var toShare  = Math.max(profit - owed, 0);  // что делится поровну
  return {income:income,expense:expense,invested:invested,returned:returned,
          personal:personal,profit:profit,owed:owed,toShare:toShare,share:toShare/5};
}

function calcPar(name){
  var invested  = sumT('invest',  'who', name);
  var returned  = sumT('return',  'who', name);
  var personal  = sumT('personal','who', name);
  var C         = calcCo();
  var netPos    = C.share - personal;  // доля минус уже взял лично
  var totalGet  = (invested - returned) + netPos; // вложения вернут + доля - личные
  return {invested:invested,returned:returned,personal:personal,
          share:C.share,netPos:netPos,totalGet:totalGet};
}

function calcBrig(b){
  var vols   = S.entries.filter(function(e){return e.type==='vol'&&e.brigade===b.id;});
  var vol    = vols.reduce(function(s,e){return s+(e.volume||0);},0);
  var earned = vols.reduce(function(s,e){return s+e.amount;},0);
  var paid   = S.entries.filter(function(e){
    return (e.type==='expense')&&e.brigade===b.id;
  }).reduce(function(s,e){return s+e.amount;},0);
  return {vol:vol,earned:earned,paid:paid,balance:earned-paid,vols:vols};
}

function badge(type){
  var t=TYPES[type]||{ico:'·',lbl:type,color:'var(--mut)',bg:'var(--s2)'};
  return '<span class="badge" style="color:'+t.color+';background:'+t.bg+'">'+t.ico+' '+t.lbl+'</span>';
}
function desc(e){
  if(e.type==='income')  return (e.note||'Приход от заказчика');
  if(e.type==='invest')  return e.who+' вложил: '+(e.note||'');
  if(e.type==='expense') return (e.note||'')+(e.cat?' ['+e.cat+']':'')+(e.brigade?' · '+bName(e.brigade):'');
  if(e.type==='personal')return e.who+' взял лично: '+(e.note||'');
  if(e.type==='return')  return 'Возврат вложений → '+e.who;
  if(e.type==='vol')     return bName(e.brigade)+': '+fmtD(e.volume||0)+' м³ × '+fmt(e.rate||0)+' ₸'+(e.zone?' · '+e.zone:'');
  return e.note||'';
}
function opRow(e,showDel){
  var tc=TYPES[e.type]||{color:'var(--mut)'};
  var h='<div class="oprow">';
  h+='<div class="opbody"><div style="margin-bottom:3px">'+badge(e.type)+'</div>';
  h+='<div class="opdesc">'+desc(e)+'</div>';
  h+='<div class="opmeta">'+e.date+(e.obj&&e.obj!=='-'?' · '+e.obj.split(',')[0]:'')+'</div>';
  if(e.photo)h+='<img src="'+e.photo+'" class="photo-thumb" onclick="viewPhoto(\''+e.id+'\')"/>';
  h+='</div>';
  h+='<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px">';
  h+='<div style="font-size:13px;font-weight:700;color:'+tc.color+'">'+fmt(e.amount)+' ₸</div>';
  if(showDel&&role==='editor')h+='<button class="delbtn" onclick="delEntry('+e.id+')">✕</button>';
  h+='</div></div>';
  return h;
}

function rCash(){

var pendingPhoto=null;
function compressPhoto(file,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var maxW=800,sc=Math.min(1,maxW/img.width);
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.7));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function viewPhoto(id){
  var e=S.entries.find(function(x){return x.id==id;});
  if(!e||!e.photo)return;
  document.getElementById('pv-img').src=e.photo;
  document.getElementById('pv').style.display='flex';
}

  else if(selType==='expense') fields=

function saveEntry(){
  var amount=parseFloat(g('f-amount'));
  if(!amount||isNaN(amount)){alert('Введите сумму');return;}
  var e={
    id:Date.now(),
    date:g('f-date')||new Date().toISOString().slice(0,10),
    type:selType,
    amount:amount,
    note:g('f-note')||''
  };
  if(selType==='income') {e.obj=g('f-obj')||S.objects[0];e.from=g('f-from')||'';}
  if(selType==='invest') {e.who=g('f-who')||'';e.obj=g('f-obj')||S.objects[0];}
  if(selType==='expense'){
    e.obj=g('f-obj')||S.objects[0];
    e.cat=g('f-cat')||'';
    e.who=g('f-who')||'';
    var bv=g('f-brig');if(bv)e.brigade=bv;
    if(pendingPhoto)e.photo=pendingPhoto;
  }
  if(selType==='personal'){e.who=g('f-who')||'';e.obj='-';}
  if(selType==='return')  {e.who=g('f-who')||'';e.obj='-';}

  S.entries.push(e);
  if(!S.history)S.history=[];
  S.history.push({action:'add',by:role,at:new Date().toISOString(),type:e.type,amount:e.amount});
  save();closeModal();render();
}

function delEntry(id){
  if(role!=='editor')return;
  if(!confirm('Удалить запись?'))return;
  var del=S.entries.find(function(e){return e.id==id;});
  S.entries=S.entries.filter(function(e){return e.id!=id;});
  if(!S.history)S.history=[];
  if(del)S.history.push({action:'delete',by:role,at:new Date().toISOString(),type:del.type,amount:del.amount});
  save();render();
}

    if(!rate||isNaN(rate)){alert('Введите расценку');return;}
    var e={id:Date.now(),date:g('f-date')||new Date().toISOString().slice(0,10),
      type:'vol',brigade:bId,volume:vol,rate:rate,amount:Math.round(vol*rate),
      zone:g('f-zone')||'',note:g('f-note')||'',obj:S.objects[0]};
    S.entries.push(e);
    var br=S.brigades.find(function(x){return x.id===bId;});if(br)br.rate=rate;
    save();closeModal();render();
  });
  document.getElementById('btn-cn-vol').addEventListener('click',closeModal);
}

function openManageObjects(){
  document.getElementById('mtit').textContent='🏗 ОБЪЕКТЫ';
  function buildList(){
    return S.objects.map(function(o,i){
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--brd)">'+
        '<span style="font-size:12px">'+o+'</span>'+
        (S.objects.length>1?'<button onclick="delObj('+i+')" class="delbtn">✕</button>':'')+
      '</div>';
    }).join('');
  }
  document.getElementById('mbody').innerHTML=
    '<div id="obj-list">'+buildList()+'</div>'+
    '<div class="fg" style="margin-top:12px"><label class="fl">Новый объект</label>'+
    '<input class="fi" id="f-newobj" type="text" placeholder="ЖК Название..."/></div>'+
    '<button class="fsave" style="background:var(--teal)" id="btn-add-obj">+ ДОБАВИТЬ</button>'+
    '<button class="fcanc" id="btn-cn-obj">Закрыть</button>';
  document.getElementById('modal').style.display='flex';
  document.getElementById('btn-add-obj').addEventListener('click',function(){
    var name=document.getElementById('f-newobj').value.trim();
    if(!name){alert('Введите название');return;}
    S.objects.push(name);save();
    document.getElementById('f-newobj').value='';
    document.getElementById('obj-list').innerHTML=buildList();
  });
  document.getElementById('btn-cn-obj').addEventListener('click',closeModal);
}
window.delObj=function(idx){
  if(!confirm('Удалить объект?'))return;
  S.objects.splice(idx,1);save();
  var el=document.getElementById('obj-list');
  if(el)el.innerHTML=S.objects.map(function(o,i){
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--brd)">'+
      '<span style="font-size:12px">'+o+'</span>'+
      (S.objects.length>1?'<button onclick="delObj('+i+')" class="delbtn">✕</button>':'')+
    '</div>';
  }).join('');
};

function showReport(){
  var C=calcCo();
  var date=new Date().toLocaleDateString('ru-RU');
  var catMap={};S.entries.filter(function(e){return e.type==='expense';}).forEach(function(e){catMap[e.cat]=(catMap[e.cat]||0)+e.amount;});

  function th(cells){return '<tr>'+cells.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';}
  function tr(cells){return '<tr>'+cells.map(function(c){return '<td>'+(c===null||c===undefined?'—':c)+'</td>';}).join('')+'</tr>';}

  var h='';
  // Шапка
  h+='<div style="background:#1a1f2e;color:#f0a500;padding:14px 16px;margin-bottom:14px;border-radius:4px">';
  h+='<div style="font-size:22px;font-weight:700;letter-spacing:2px">LIONGATE</div>';
  h+='<div style="font-size:10px;color:#aaa;margin-top:3px">LionGate Construction · ЖК «Алгабас» · Sensata Group · '+date+'</div></div>';

  // KPI
  var kpis=[
    ['Доходы от заказчика',fmt(C.income)+' ₸','#2ea043'],
    ['Расходы компании',fmt(C.expense)+' ₸','#da3633'],
    ['Прибыль / убыток',fmt(C.profit)+' ₸',C.profit>=0?'#2ea043':'#da3633'],
    ['Вложено партнёрами',fmt(C.invested)+' ₸','#388bfd'],
    ['Вернуть партнёрам',fmt(C.owed)+' ₸','#388bfd'],
    ['Доля каждого',fmt(C.share)+' ₸','#f0a500'],
  ];
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">';
  kpis.forEach(function(k){h+='<div style="background:#f8f9fa;border-left:4px solid '+k[2]+';padding:8px 12px;border-radius:4px;min-width:140px;flex:1"><div style="font-size:9px;color:#888;text-transform:uppercase;margin-bottom:3px">'+k[0]+'</div><div style="font-size:16px;font-weight:700;color:'+k[2]+'">'+k[1]+'</div></div>';});
  h+='</div>';

  // P&L
  h+='<h2>P&L — Доходы и расходы</h2><table>'+th(['Статья','Сумма (₸)','%']);
  Object.entries(catMap).sort(function(a,b){return b[1]-a[1];}).forEach(function(cv){h+=tr([cv[0],fmt(cv[1]),C.expense?Math.round(cv[1]/C.expense*100)+'%':'—']);});
  h+=tr(['ИТОГО РАСХОДЫ','<b>'+fmt(C.expense)+'</b>','100%']);
  h+='</table>';

  // Партнёры
  h+='<h2>Партнёры</h2><table>'+th(['Партнёр','Вложил','Возвращено','Взял лично','Доля','К получению']);
  PARTNERS.forEach(function(p,i){
    var P=calcPar(p);
    h+='<tr><td style="color:'+PC[i]+';font-weight:700">'+p+'</td>'+
      '<td>'+fmt(P.invested)+'</td><td>'+fmt(P.returned)+'</td>'+
      '<td>'+fmt(P.personal)+'</td><td>'+fmt(C.share)+'</td>'+
      '<td style="color:'+(P.totalGet>=0?'green':'red')+';font-weight:700">'+fmt(Math.abs(P.totalGet))+(P.totalGet>=0?' ↑':' ↓')+'</td></tr>';
  });
  h+='</table>';

  // Бригады
  h+='<h2>Бригады</h2><table>'+th(['Бригада','Объём (м³)','Начислено','Выплачено','Остаток']);
  S.brigades.forEach(function(b){
    var B=calcBrig(b);
    h+=tr([b.name+' · '+b.spec,fmtD(B.vol)+' м³',fmt(B.earned),fmt(B.paid),'<span style="color:'+(B.balance>0?'red':'green')+';font-weight:700">'+fmt(B.balance)+'</span>']);
  });
  h+='</table>';

  // Все расходы
  h+='<h2>Все расходы компании</h2><table>'+th(['Дата','Статья','Кто','Сумма (₸)','Примечание','Бригада']);
  [].concat(S.entries).filter(function(e){return e.type==='expense';}).sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    h+=tr([e.date,e.cat||'—',e.who||'—',fmt(e.amount),e.note||'—',e.brigade?bName(e.brigade):'—']);
  });
  h+=tr(['','','<b>ИТОГО</b>','<b>'+fmt(C.expense)+'</b>','','']);
  h+='</table>';

  // Вложения
  h+='<h2>Вложения партнёров</h2><table>'+th(['Дата','Партнёр','Сумма (₸)','Примечание']);
  [].concat(S.entries).filter(function(e){return e.type==='invest';}).sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    h+=tr([e.date,e.who,fmt(e.amount),e.note||'—']);
  });
  h+=tr(['','<b>ИТОГО</b>','<b>'+fmt(C.invested)+'</b>','']);
  h+='</table>';

  // Личные изъятия
  h+='<h2>Личные изъятия</h2><table>'+th(['Дата','Партнёр','Сумма (₸)','Примечание']);
  [].concat(S.entries).filter(function(e){return e.type==='personal';}).sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    h+=tr([e.date,e.who,fmt(e.amount),e.note||'—']);
  });
  h+='</table>';

  // Движение денег
  h+='<h2>Движение денег</h2><table>'+th(['Дата','Тип','Описание','Приход','Расход','Остаток']);
  var run=0;
  [].concat(S.entries).filter(function(e){return e.type!=='vol';}).sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    var sign=(e.type==='income'||e.type==='invest')?1:-1;
    run+=sign*e.amount;
    var t=TYPES[e.type]||{lbl:e.type};
    h+=tr([e.date,t.lbl,desc(e),sign>0?fmt(e.amount):'',sign<0?fmt(e.amount):'','<b style="color:'+(run>=0?'green':'red')+'">'+fmt(run)+'</b>']);
  });
  h+='</table>';

  // Баланс
  h+='<h2>Баланс компании</h2><table>'+th(['Показатель','Сумма (₸)']);
  h+=tr(['Вложения партнёров','+'+fmt(C.invested)]);
  h+=tr(['Доходы от заказчика','+'+fmt(C.income)]);
  h+=tr(['Расходы компании','−'+fmt(C.expense)]);
  h+=tr(['Личные изъятия','−'+fmt(C.personal)]);
  h+=tr(['Возвращено партнёрам','−'+fmt(C.returned)]);
  h+=tr(['<b>Остаток в кассе</b>','<b>'+fmt(C.invested+C.income-C.expense-C.personal-C.returned)+'</b>']);
  h+='</table>';

  h+='<p style="text-align:center;color:#aaa;font-size:10px;margin-top:20px">LIONGATE · LionGate Construction · '+date+' · Конфиденциально</p>';

  document.getElementById('rpt-body').innerHTML=h;
  document.getElementById('rpt').style.display='block';
  document.getElementById('rpt').scrollTop=0;
}

function shareReport(){
  var content=document.getElementById('rpt-body').innerHTML;
  var date=new Date().toLocaleDateString('ru-RU');
  var full='<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>LIONGATE '+date+'</title>'+
    '<style>body{font-family:Arial,sans-serif;font-size:11px;color:#222;padding:16px;max-width:900px;margin:0 auto}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:12px}th{background:#1a1f2e;color:#f0a500;padding:6px 8px;text-align:left;font-size:10px}'+
    'td{padding:5px 8px;border-bottom:1px solid #eee;font-size:10px}tr:nth-child(even) td{background:#f9f9f9}'+
    'h2{font-size:13px;color:#1a1f2e;margin:16px 0 6px;padding-bottom:4px;border-bottom:3px solid #f0a500}'+
    '@page{margin:10mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>'+
    '</head><body>'+content+'</body></html>';
  var blob=new Blob([full],{type:'text/html;charset=utf-8'});
  var fname='LIONGATE_'+date.replace(/\./g,'-')+'.html';
  if(navigator.share&&navigator.canShare){
    var file=new File([blob],fname,{type:'text/html'});
    if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'LIONGATE Отчёт '+date}).catch(function(){printReport();});return;}
  }
  printReport();
}

function printReport(){
  var content=document.getElementById('rpt-body').innerHTML;
  var date=new Date().toLocaleDateString('ru-RU');
  var pw=window.open('','_blank');
  if(!pw){alert('Разрешите всплывающие окна');return;}
  pw.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>LIONGATE '+date+'</title>'+
    '<style>body{font-family:Arial,sans-serif;font-size:11px;color:#222;padding:16px}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:12px}th{background:#1a1f2e;color:#f0a500;padding:6px 8px;text-align:left;font-size:10px}'+
    'td{padding:5px 8px;border-bottom:1px solid #eee;font-size:10px}'+
    'h2{font-size:13px;color:#1a1f2e;margin:16px 0 6px;padding-bottom:4px;border-bottom:3px solid #f0a500}'+
    '@page{margin:10mm}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>'+
    '</head><body>'+content+'<script>window.onload=function(){window.print();}<\/script></body></html>');
  pw.document.close();
}

// ══════════════════════════════════════════
// INIT — все события в одном месте
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded',function(){
  // Login
  document.getElementById('btn-login').addEventListener('click',tryLogin);
  document.getElementById('btn-view').addEventListener('click',viewOnly);
  document.getElementById('lpass').addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});

  // App buttons
  document.getElementById('btn-out').addEventListener('click',doLogout);
  document.getElementById('fab').addEventListener('click',openModal);
  document.getElementById('btn-obj').addEventListener('click',openManageObjects);
  document.getElementById('btn-rpt').addEventListener('click',showReport);

  // Report
  document.getElementById('btn-share').addEventListener('click',shareReport);
  document.getElementById('btn-print').addEventListener('click',printReport);
  document.getElementById('btn-rpt-close').addEventListener('click',function(){document.getElementById('rpt').style.display='none';});

  // Photo viewer
  document.getElementById('pv-close').addEventListener('click',function(){document.getElementById('pv').style.display='none';});
  document.getElementById('pv').addEventListener('click',function(e){if(e.target===this)this.style.display='none';});

  // Modal close
  document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

  // Nav tabs
  ['main','pl','partners','brigades','cash','journal','history'].forEach(function(t){
    document.getElementById('tab-'+t).addEventListener('click',function(){setTab(t);});
  });

  // Journal search/filter (delegated)
  document.getElementById('content').addEventListener('change',function(e){
    if(e.target.id==='j-type')fType=e.target.value;
    if(e.target.id==='j-obj')fObj=e.target.value;
    render();
  });
  document.getElementById('content').addEventListener('input',function(e){
    if(e.target.id==='j-search'){searchQ=e.target.value;render();}
  });

  // Auto-refresh every 30s
  setInterval(function(){if(role)pullCloud(function(){render();});},30000);

  // Check saved session
  var sr=sessionStorage.getItem('role');
  if(sr){role=sr;startApp();}
});

function tryLogin(){
  var p=document.getElementById('lpass').value.trim();
  if(PWD[p]){role=PWD[p];sessionStorage.setItem('role',role);startApp();}
  else{document.getElementById('lerr').textContent='Неверный пароль';document.getElementById('lpass').value='';}
}
function viewOnly(){role='viewer';sessionStorage.setItem('role','viewer');startApp();}
function doLogout(){
  sessionStorage.removeItem('role');role=null;
  document.getElementById('app').style.display='none';
  document.getElementById('ls').style.display='flex';
  document.getElementById('lpass').value='';
  document.getElementById('lerr').textContent='';
}
function startApp(){
  document.getElementById('ls').style.display='none';
  document.getElementById('app').style.display='flex';
  var rp=document.getElementById('rpill'),fab=document.getElementById('fab');
  if(role==='editor'){rp.textContent='Редактор';rp.className='rpill re';fab.style.display='flex';}
  else{rp.textContent='Просмотр';rp.className='rpill rv';fab.style.display='none';}
  pullCloud(function(){render();});
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
