<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0d1117"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="LIONGATE"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="manifest" href="manifest.json"/>
<title>LIONGATE</title>
<style>
:root{
  --bg:#0d1117;--sur:#161b22;--s2:#1c2333;--brd:#30363d;
  --gold:#f0a500;--glt:rgba(240,165,0,.12);
  --green:#2ea043;--grlt:rgba(46,160,67,.12);
  --red:#da3633;--rlt:rgba(218,54,51,.12);
  --blue:#388bfd;--bllt:rgba(56,139,253,.12);
  --purple:#8957e5;--plt:rgba(137,87,229,.12);
  --teal:#2dd4bf;--tlt:rgba(45,212,191,.12);
  --orange:#e8892b;--olt:rgba(232,137,43,.12);
  --text:#e6edf3;--mut:#8b949e;
  --fd:'Bebas Neue',sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fm);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;padding:24px}
.ll{font-family:var(--fd);font-size:44px;color:var(--gold);letter-spacing:4px}
.lsub{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-top:-8px}
.lbox{background:var(--sur);border:1px solid var(--brd);border-radius:16px;padding:24px;width:100%;max-width:320px}
.ltit{font-family:var(--fd);font-size:20px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.lhnt{font-size:10px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.linp{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:12px;color:var(--text);font-family:var(--fm);font-size:18px;outline:none;text-align:center;letter-spacing:6px}
.linp:focus{border-color:var(--gold)}
.lbtn{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:13px;border-radius:10px;cursor:pointer;margin-top:10px}
.lvbtn{width:100%;background:transparent;color:var(--mut);border:1px solid var(--brd);font-family:var(--fm);font-size:11px;padding:9px;border-radius:8px;cursor:pointer;margin-top:6px}
.lerr{color:var(--red);font-size:11px;text-align:center;margin-top:6px;min-height:14px}
header{background:var(--sur);border-bottom:3px solid var(--gold);padding:11px 14px 9px;display:flex;align-items:center;flex-shrink:0}
.hlog{font-family:var(--fd);font-size:22px;color:var(--gold);letter-spacing:3px;line-height:1}
.hsub{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.hrgt{margin-left:auto;display:flex;align-items:center;gap:5px}
.rpill{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700}
.re{background:var(--glt);color:var(--gold)}.rv{background:var(--bllt);color:var(--blue)}
.hbtn{background:transparent;border:1px solid var(--brd);color:var(--mut);font-size:10px;padding:5px 8px;border-radius:6px;cursor:pointer;font-family:var(--fm)}
.content{flex:1;overflow-y:auto;padding:12px 14px 90px}
.content::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--brd);display:flex;z-index:90;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 1px 4px;cursor:pointer;border:none;background:transparent;color:var(--mut);font-family:var(--fm);font-size:6px;letter-spacing:.3px;text-transform:uppercase;gap:1px}
.nb.active{color:var(--gold)}.nb .ic{font-size:14px;line-height:1}
.fab{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));right:14px;width:52px;height:52px;background:var(--gold);border:none;border-radius:50%;font-size:26px;color:#0d1117;cursor:pointer;z-index:89;box-shadow:0 4px 18px rgba(240,165,0,.45);display:flex;align-items:center;justify-content:center}
.warn{border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:11px;font-weight:700;border:1px solid;display:flex;align-items:center;gap:8px}
.banner{background:linear-gradient(135deg,#1c2333,#161b22);border:1px solid var(--brd);border-left:4px solid var(--orange);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.bn-label{font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.bn-obj{font-family:var(--fd);font-size:16px;color:var(--text);letter-spacing:1px}
.bn-date{font-size:10px;color:var(--mut);margin-top:2px}
.bn-big{font-family:var(--fd);font-size:40px;line-height:1}
.bn-unit{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:2px}
.dcard{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px}
.dtop{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.dbig{font-family:var(--fd);font-size:36px;line-height:1}
.dpct{font-family:var(--fd);font-size:28px;color:var(--text)}
.ptrack{background:var(--s2);border-radius:6px;height:12px;overflow:hidden;margin-bottom:6px}
.pfill{height:100%;border-radius:6px}
.plabels{display:flex;justify-content:space-between;font-size:9px;color:var(--mut)}
.dmini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dmini-i{background:var(--s2);border-radius:8px;padding:8px;text-align:center}
.dmini-v{font-family:var(--fd);font-size:16px;margin-bottom:2px}
.dmini-l{font-size:7px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kc{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:12px;position:relative;overflow:hidden}
.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--cbar,#f0a500)}
.kc-l{font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kc-v{font-family:var(--fd);font-size:22px;line-height:1;margin-bottom:3px}
.kc-s{font-size:8px;color:var(--mut)}
.kc-t{font-size:9px;margin-top:4px}
.sect{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:3px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.sect::after{content:'';flex:1;height:1px;background:var(--brd)}
.kfuc{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:8px}
.kfu-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kfu-n{font-size:12px;font-weight:700}
.kfu-o{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700}
.kfu-m{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kfu-mi{background:var(--s2);border-radius:8px;padding:8px;text-align:center}
.kfu-mv{font-family:var(--fd);font-size:18px;line-height:1;margin-bottom:2px}
.kfu-ml{font-size:7px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.mini-chart{height:40px;display:flex;align-items:flex-end;gap:3px;margin-top:6px}
.mini-bar{flex:1;border-radius:3px 3px 0 0;min-height:3px}
.wkcmp{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:10px}
.wkcols{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.wkc{text-align:center}
.wkl{font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.wkv{font-family:var(--fd);font-size:24px;line-height:1}
.wks{font-size:8px;color:var(--mut);margin-top:2px}
.wkd{border-radius:8px;padding:6px;text-align:center;margin-top:8px}
.recc{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:12px;margin-bottom:10px}
.reci{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--s2)}
.reci:last-child{border-bottom:none}
.recb{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;margin-bottom:2px;display:inline-block}
.recd{font-size:10px;color:var(--mut)}
.reca{font-size:13px;font-weight:700;text-align:right}
.rect{font-size:9px;color:var(--mut);text-align:right}
.ctit{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shdr h2{font-family:var(--fd);font-size:20px;letter-spacing:1px}
.r2{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:11px}
.r2 .lb{color:var(--mut)}.r2 .vl{font-weight:700}
.divider{border-top:1px solid var(--brd);margin:8px 0}
.bar{background:var(--s2);border-radius:2px;height:5px;margin-top:5px}
.barfill{border-radius:2px;height:100%}
.empty{text-align:center;padding:30px;color:var(--mut);font-size:11px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700}
.delbtn{background:none;border:1px solid var(--brd);color:var(--mut);border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;flex-shrink:0}
.fedit{background:transparent;border:1px solid var(--brd);color:var(--mut);border-radius:6px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:var(--fm)}
.oprow{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #1c2333}
.oprow:last-child{border-bottom:none}
.opbody{flex:1;min-width:0}
.opdesc{font-size:11px;line-height:1.4}
.opmeta{font-size:9px;color:var(--mut);margin-top:2px}
.photo-thumb{max-height:70px;border-radius:6px;cursor:pointer;margin-top:4px}
.bcard{background:var(--sur);border-radius:10px;border:1px solid var(--teal);margin-bottom:12px;overflow:hidden}
.bhdr{background:var(--tlt);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.bname{font-family:var(--fd);font-size:18px;letter-spacing:1px;color:var(--teal)}
.bbody{padding:12px 14px}
.kg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.kpi{background:var(--sur);border-radius:10px;padding:10px 11px;border-left:3px solid}
.klbl{font-size:7px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.kval{font-family:var(--fd);font-size:18px;letter-spacing:1px;line-height:1.1}
.ksub{font-size:8px;color:var(--mut);margin-top:2px}
.sdiv{background:var(--s2);border-radius:6px;padding:5px 10px;margin:8px 0;font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
.pcard{background:var(--sur);border-radius:10px;border:1px solid var(--brd);margin-bottom:10px;overflow:hidden}
.phdr{padding:11px 14px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.pname{font-family:var(--fd);font-size:18px;letter-spacing:1px}
.pbody{padding:10px 14px 12px}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.mbox{background:var(--sur);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:94vh;overflow-y:auto}
.mhandle{width:40px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 14px}
.mtit{font-family:var(--fd);font-size:22px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tcard{border-radius:12px;padding:12px;border:2px solid;cursor:pointer;text-align:left}
.tcard .tic{font-size:22px;margin-bottom:5px}
.tcard .ttit{font-family:var(--fd);font-size:15px;letter-spacing:1px;margin-bottom:3px}
.tcard .tdsc{font-size:9px;color:var(--mut);line-height:1.4}
.tcard.sel{opacity:1}.tcard:not(.sel){opacity:.4}
.tc-income{border-color:var(--green);background:var(--grlt)}
.tc-invest{border-color:var(--blue);background:var(--bllt)}
.tc-expense{border-color:var(--red);background:var(--rlt)}
.tc-personal{border-color:var(--purple);background:var(--plt)}
.tc-return{border-color:var(--gold);background:var(--glt)}
.fg{margin-bottom:12px}
.fl{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;display:block}
.fi{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:11px 12px;color:var(--text);font-family:var(--fm);font-size:14px;outline:none}
.fi:focus{border-color:var(--gold)}
textarea.fi{resize:vertical;min-height:60px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fsave{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:14px;border-radius:10px;cursor:pointer;margin-top:10px}
.fcanc{width:100%;background:transparent;color:var(--mut);border:1px solid var(--brd);font-family:var(--fm);font-size:12px;padding:10px;border-radius:10px;cursor:pointer;margin-top:6px}
.photo-area{border:2px dashed var(--brd);border-radius:8px;padding:14px;text-align:center;cursor:pointer;color:var(--mut);font-size:11px}
.photo-prev{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:8px;display:none}
canvas{display:block;width:100%;border-radius:8px}
#rpt{display:none;position:fixed;inset:0;background:#fff;z-index:500;overflow-y:auto}
#rpt-bar{position:sticky;top:0;background:#fff;border-bottom:2px solid #f0a500;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:1;gap:6px;flex-wrap:wrap}
#rpt-bar h1{font-size:16px;color:#f0a500;font-family:Arial,sans-serif;margin:0}
#rpt-body{padding:16px;font-family:Arial,sans-serif;font-size:12px;color:#222}
#rpt-body h2{font-size:13px;color:#1a1f2e;margin:16px 0 6px;padding-bottom:4px;border-bottom:3px solid #f0a500}
#rpt-body table{width:100%;border-collapse:collapse;margin-bottom:12px}
#rpt-body th{background:#1a1f2e;color:#f0a500;padding:6px 8px;text-align:left;font-size:10px}
#rpt-body td{padding:5px 8px;border-bottom:1px solid #eee;font-size:10px}
#rpt-body tr:nth-child(even) td{background:#f9f9f9}
@media print{#rpt-bar{display:none}#app,nav,.fab{display:none!important}#rpt{display:block!important}}
#pv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;align-items:center;justify-content:center;padding:20px}
@media(min-width:600px){.kgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="ls">
  <div style="text-align:center">
    <svg width="80" height="80" viewBox="0 0 512 512" style="margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(240,165,0,0.5))">
      <defs>
        <linearGradient id="gbg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a2332"/><stop offset="100%" stop-color="#0d1117"/></linearGradient>
        <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5c842"/><stop offset="100%" stop-color="#e8892b"/></linearGradient>
      </defs>
      <rect width="512" height="512" rx="100" fill="url(#gbg)"/>
      <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#gg)" stroke-width="8" opacity="0.5"/>
      <text x="256" y="310" font-family="Arial Black,sans-serif" font-size="220" font-weight="900" fill="url(#gg)" text-anchor="middle">LG</text>
      <rect x="100" y="340" width="312" height="6" rx="3" fill="url(#gg)" opacity="0.7"/>
      <text x="256" y="410" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="url(#gg)" text-anchor="middle" letter-spacing="8">LIONGATE</text>
    </svg>
    <div class="ll">LIONGATE</div>
    <div class="lsub">LionGate Construction</div>
  </div>
  <div class="lbox">
    <div class="ltit">ВХОД</div>
    <div class="lhnt">Введите пароль чтобы вносить данные.<br>Партнёры — просмотр без пароля.</div>
    <input class="linp" type="password" id="lpass" placeholder="......"/>
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="btn-login">ВОЙТИ</button>
    <button class="lvbtn" id="btn-view">Только просмотр</button>
  </div>
</div>
<div id="rpt">
  <div id="rpt-bar">
    <h1>LIONGATE — Отчёт</h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="btn-share" style="background:#2ea043;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer">Поделиться</button>
      <button id="btn-print" style="background:#f0a500;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer">PDF</button>
      <button id="btn-rpt-close" style="background:#eee;color:#333;border:none;padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer">X</button>
    </div>
  </div>
  <div id="rpt-body"></div>
</div>
<div id="app" style="display:none">
  <header>
    <div><div class="hlog">LIONGATE</div><div class="hsub">ЖК АЛГАБАС · SENSATA GROUP</div></div>
    <div class="hrgt">
      <span id="sync-st" style="font-size:9px;color:var(--green)"></span>
      <span class="rpill" id="rpill"></span>
      <button class="hbtn" id="btn-obj" style="border-color:var(--teal);color:var(--teal)">Об</button>
      <button class="hbtn" id="btn-rpt" style="border-color:var(--green);color:var(--green)">Отчёт</button>
      <button class="hbtn" id="btn-out">Выйти</button>
    </div>
  </header>
  <div class="content" id="content"></div>
  <button class="fab" id="fab">+</button>
  <nav>
    <button class="nb active" id="tab-main"><span class="ic">◈</span><span>Сводка</span></button>
    <button class="nb" id="tab-pl"><span class="ic">$</span><span>P&amp;L</span></button>
    <button class="nb" id="tab-partners"><span class="ic">@</span><span>Партнёры</span></button>
    <button class="nb" id="tab-brigades"><span class="ic">#</span><span>Бригады</span></button>
    <button class="nb" id="tab-plan"><span class="ic">!</span><span>План</span></button>
    <button class="nb" id="tab-journal"><span class="ic">=</span><span>Журнал</span></button>
    <button class="nb" id="tab-history"><span class="ic">~</span><span>История</span></button>
  </nav>
</div>
<div id="modal" style="display:none" class="mbg">
  <div class="mbox"><div class="mhandle"></div><div class="mtit" id="mtit">НОВАЯ ЗАПИСЬ</div><div id="mbody"></div></div>
</div>
<div id="pv" style="display:none">
  <div style="text-align:center;max-width:100%">
    <img id="pv-img" style="max-width:100%;max-height:80vh;border-radius:8px"/>
    <div style="margin-top:12px"><button id="pv-close" style="background:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer">Закрыть</button></div>
  </div>
</div>
<script>

'use strict';
var TYPES={
  income:{ico:'💰',lbl:'Приход от заказчика',color:'var(--green)',bg:'var(--grlt)'},
  invest:{ico:'💼',lbl:'Вложил партнёр',color:'var(--blue)',bg:'var(--bllt)'},
  expense:{ico:'🧾',lbl:'Расход компании',color:'var(--red)',bg:'var(--rlt)'},
  personal:{ico:'👤',lbl:'Взял лично',color:'var(--purple)',bg:'var(--plt)'},
  return:{ico:'🔄',lbl:'Возврат вложений',color:'var(--gold)',bg:'var(--glt)'}
};

function calcCo(){var income=sumT('income'),expense=sumT('expense'),invested=sumT('invest'),returned=sumT('return');var personal=S.entries.filter(function(e){return e.type==='personal';}).reduce(function(s,e){return s+e.amount;},0);var profit=income-expense,owed=invested-returned,toShare=Math.max(profit-owed,0);var cash=invested+income-expense-personal-returned;return{income:income,expense:expense,invested:invested,returned:returned,personal:personal,profit:profit,owed:owed,toShare:toShare,share:toShare/5,cash:cash};}

function drawBar(id,labels,datasets,h,legend){var cv=document.getElementById(id);if(!cv)return;var ctx=cv.getContext('2d');var W=cv.offsetWidth||300,H=h||180;cv.width=W*2;cv.height=H*2;cv.style.height=H+'px';ctx.scale(2,2);var pb={t:16,r:8,b:legend?48:36,l:44};var cw=W-pb.l-pb.r,ch=H-pb.t-pb.b;ctx.fillStyle='#161b22';ctx.fillRect(0,0,W,H);var av=[];datasets.forEach(function(d){d.data.forEach(function(v){av.push(Math.abs(v||0));});});var mx=Math.max.apply(null,av)||1;ctx.strokeStyle='#30363d';ctx.lineWidth=0.5;ctx.setLineDash([3,3]);for(var gi=0;gi<=4;gi++){var gy=pb.t+ch*(1-gi/4);ctx.beginPath();ctx.moveTo(pb.l,gy);ctx.lineTo(pb.l+cw,gy);ctx.stroke();ctx.fillStyle='#8b949e';ctx.font='9px monospace';ctx.textAlign='right';var gv=Math.round(mx*gi/4);ctx.fillText(gv>=1000?Math.round(gv/1000)+'k':gv,pb.l-3,gy+3);}ctx.setLineDash([]);var n=labels.length,ds=datasets.length;var grpW=cw/n,barW=Math.min(grpW/ds*0.7,28),gap=(grpW-barW*ds)/2;labels.forEach(function(lbl,li){datasets.forEach(function(dataset,di){var v=dataset.data[li]||0;var bx=pb.l+li*grpW+gap+di*barW;var bh=Math.abs(v)/mx*ch;var by=pb.t+ch-bh;ctx.fillStyle=dataset.color||'#388bfd';var r=Math.min(3,barW/2);ctx.beginPath();ctx.moveTo(bx+r,by);ctx.lineTo(bx+barW-r,by);ctx.quadraticCurveTo(bx+barW,by,bx+barW,by+r);ctx.lineTo(bx+barW,by+bh);ctx.lineTo(bx,by+bh);ctx.lineTo(bx,by+r);ctx.quadraticCurveTo(bx,by,bx+r,by);ctx.closePath();ctx.fill();if(v>0&&bh>14){ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(v>=1000?Math.round(v/1000)+'k':v,bx+barW/2,by+bh-4);}});ctx.fillStyle='#8b949e';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(lbl,pb.l+li*grpW+grpW/2,H-pb.b+13);});if(legend){var lx=pb.l;var ly=H-10;datasets.forEach(function(d){ctx.fillStyle=d.color;ctx.fillRect(lx,ly-7,10,8);ctx.fillStyle='#8b949e';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText(d.label||'',lx+13,ly+1);lx+=ctx.measureText(d.label||'').width+26;});}}
