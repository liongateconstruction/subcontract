  <title>LIONGATE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root{
      --bg:#0d1117;--sur:#161b22;--s2:#1c2333;--brd:#30363d;
      --gold:#f0a500;--glt:rgba(240,165,0,.12);
      --green:#2ea043;--grlt:rgba(46,160,67,.12);
      --red:#da3633;--rlt:rgba(218,54,51,.12);
      --blue:#388bfd;--bllt:rgba(56,139,253,.12);
      --purple:#8957e5;--plt:rgba(137,87,229,.12);
      --teal:#2dd4bf;--tlt:rgba(45,212,191,.12);
      --orange:#e8892b;--olt:rgba(232,137,43,.12);
      --text:#e6edf3;--mut:#8b949e;
      --fd:'Bebas Neue',sans-serif;--fm:'IBM Plex Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fm);overflow:hidden}
    #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
    /* LOGIN */
    #ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;padding:24px}
    .ll{font-family:var(--fd);font-size:44px;color:var(--gold);letter-spacing:4px}
    .lsub{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-top:-8px}
    .lbox{background:var(--sur);border:1px solid var(--brd);border-radius:16px;padding:24px;width:100%;max-width:320px}
    .ltit{font-family:var(--fd);font-size:20px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
    .lhnt{font-size:10px;color:var(--mut);margin-bottom:16px;line-height:1.5}
    .linp{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:12px;color:var(--text);font-family:var(--fm);font-size:18px;outline:none;text-align:center;letter-spacing:6px;transition:border-color .15s}
    .linp:focus{border-color:var(--gold)}
    .lbtn{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:13px;border-radius:10px;cursor:pointer;margin-top:10px}
    .lvbtn{width:100%;background:transparent;color:var(--mut);border:1px solid var(--brd);font-family:var(--fm);font-size:11px;padding:9px;border-radius:8px;cursor:pointer;margin-top:6px}
    .lerr{color:var(--red);font-size:11px;text-align:center;margin-top:6px;min-height:14px}
    /* HEADER */
    header{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 14px 8px;display:flex;align-items:center;flex-shrink:0}
    .hlog{font-family:var(--fd);font-size:20px;color:var(--gold);letter-spacing:2px;line-height:1}
    .hsub{font-size:8px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
    .hrgt{margin-left:auto;display:flex;align-items:center;gap:6px}
    .rpill{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700}
    .re{background:var(--glt);color:var(--gold)}.rv{background:var(--bllt);color:var(--blue)}
    .hout{background:transparent;border:1px solid var(--brd);color:var(--mut);font-size:10px;padding:5px 8px;border-radius:6px;cursor:pointer;font-family:var(--fm)}
    .content{flex:1;overflow-y:auto;padding:12px 14px 90px}
    .content::-webkit-scrollbar{width:3px}.content::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
    nav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--brd);display:flex;z-index:90;padding-bottom:env(safe-area-inset-bottom)}
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 2px 5px;cursor:pointer;border:none;background:transparent;color:var(--mut);font-family:var(--fm);font-size:7px;letter-spacing:.3px;text-transform:uppercase;gap:2px;transition:color .15s}
    .nb.active{color:var(--gold)}.nb .ic{font-size:16px;line-height:1}
    .fab{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));right:14px;width:52px;height:52px;background:var(--gold);border:none;border-radius:50%;font-size:26px;color:#0d1117;cursor:pointer;z-index:89;box-shadow:0 4px 18px rgba(240,165,0,.45);display:flex;align-items:center;justify-content:center}
    /* CARDS */
    .card{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px}
    .ctit{font-size:9px;color:var(--mut);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
    .shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .shdr h2{font-family:var(--fd);font-size:20px;letter-spacing:1px}
    .kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .kg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
    .kpi{background:var(--sur);border-radius:10px;padding:10px 11px;border-left:3px solid}
    .klbl{font-size:7px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
    .kval{font-family:var(--fd);font-size:18px;letter-spacing:1px;line-height:1.1}
    .ksub{font-size:8px;color:var(--mut);margin-top:2px}
    .r2{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:11px}
    .r2 .lb{color:var(--mut)}.r2 .vl{font-weight:700}
    .divider{border-top:1px solid var(--brd);margin:8px 0}
    .oprow{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #1c2333}
    .oprow:last-child{border-bottom:none}
    .opbody{flex:1;min-width:0}
    .opdesc{font-size:11px;line-height:1.4}
    .opmeta{font-size:9px;color:var(--mut);margin-top:2px}
    .delbtn{background:none;border:1px solid var(--brd);color:var(--mut);border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;flex-shrink:0}
    .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700}
    .bar{background:var(--s2);border-radius:2px;height:5px;margin-top:5px}
    .barfill{border-radius:2px;height:100%;transition:width .4s}
    .infobox{border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:10px;line-height:1.6;border:1px solid}
    .empty{text-align:center;padding:30px;color:var(--mut);font-size:11px}
    .pcard{background:var(--sur);border-radius:10px;border:1px solid var(--brd);margin-bottom:10px;overflow:hidden}
    .phdr{padding:11px 14px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
    .pname{font-family:var(--fd);font-size:18px;letter-spacing:1px}
    .pbody{padding:10px 14px 12px}
    .sok{background:var(--grlt);border:1px solid var(--green);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:10px;color:var(--green)}
    .sbad{background:var(--rlt);border:1px solid var(--red);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:10px;color:var(--red)}
    .szero{background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:10px;color:var(--mut)}
    .bcard{background:var(--sur);border-radius:10px;border:1px solid var(--teal);margin-bottom:12px;overflow:hidden}
    .bhdr{background:var(--tlt);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
    .bname{font-family:var(--fd);font-size:18px;letter-spacing:1px;color:var(--teal)}
    .bbody{padding:12px 14px}
    .sdiv{background:var(--s2);border-radius:6px;padding:5px 10px;margin:8px 0;font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
    /* MODAL */
    .mbg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
    .mbox{background:var(--sur);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:94vh;overflow-y:auto}
    .mhandle{width:40px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 14px}
    .mtit{font-family:var(--fd);font-size:22px;color:var(--gold);letter-spacing:2px;margin-bottom:14px}
    .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    .tcard{border-radius:12px;padding:11px;border:2px solid;cursor:pointer;transition:opacity .15s}
    .tcard .tic{font-size:20px;margin-bottom:4px}.tcard .ttit{font-family:var(--fd);font-size:14px;letter-spacing:1px;margin-bottom:2px}.tcard .tdsc{font-size:9px;color:var(--mut);line-height:1.3}
    .tcard.sel{opacity:1}.tcard:not(.sel){opacity:.4}
    .tc-exp{border-color:var(--red);background:var(--rlt)}
    .tc-inv{border-color:var(--blue);background:var(--bllt)}
    .tc-inc{border-color:var(--green);background:var(--grlt)}
    .tc-per{border-color:var(--purple);background:var(--plt)}
    .tc-ret{border-color:var(--gold);background:var(--glt)}
    .tc-rep{border-color:var(--orange);background:var(--olt)}
    .fg{margin-bottom:12px}
    .fl{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;display:block}
    .fi{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:11px 12px;color:var(--text);font-family:var(--fm);font-size:14px;outline:none;transition:border-color .15s}
    .fi:focus{border-color:var(--gold)}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .fsave{width:100%;background:var(--gold);color:#0d1117;border:none;font-family:var(--fd);font-size:20px;letter-spacing:2px;padding:14px;border-radius:10px;cursor:pointer;margin-top:10px}

var API_KEY='$2a$10$GBjOzIGzwTDlm4AZ4NkFS.nQXesYbuM/MNy2EYw4JV/QrDHiZG31m';
var BIN_ID='6a0a38b9c0954111d83ac9f8';
var BIN_URL='https://api.jsonbin.io/v3/b/'+BIN_ID;
var syncTimer=null;

function loadState(){
  try{var s=localStorage.getItem('lg_v1');return s?JSON.parse(s):defaultState();}
  catch(e){return defaultState();}
}

function save(){
  try{localStorage.setItem('lg_v1',JSON.stringify(state));}catch(e){}
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){saveToCloud();},1500);
}

function saveToCloud(){
  var data={entries:state.entries,brigades:state.brigades};
  fetch(BIN_URL,{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':API_KEY,'X-Bin-Versioning':'false'},
    body:JSON.stringify(data)
  }).then(function(){
    showSyncStatus('✅ Сохранено',false);
  }).catch(function(){
    showSyncStatus('⚠️ Офлайн',true);
  });
}

function loadFromCloud(callback){
  showSyncStatus('🔄...',false);
  fetch(BIN_URL,{headers:{'X-Master-Key':API_KEY}})
  .then(function(r){return r.json();})
  .then(function(data){
    if(data&&data.record&&data.record.entries&&data.record.entries.length>0){
      state.entries=data.record.entries;
      if(data.record.brigades&&data.record.brigades.length>0)state.brigades=data.record.brigades;
      try{localStorage.setItem('lg_v1',JSON.stringify(state));}catch(e){}
      showSyncStatus('✅ Синхронизировано',false);
    } else {
      if(state.entries.length>0)saveToCloud();
      showSyncStatus('✅ OK',false);
    }
    if(callback)callback();
  }).catch(function(){
    showSyncStatus('⚠️ Офлайн',true);
    if(callback)callback();
  });
}

function showSyncStatus(msg,isError){
  var el=document.getElementById('sync-status');
  if(!el)return;
  el.textContent=msg;
  el.style.color=isError?'var(--red)':'var(--green)';
  setTimeout(function(){if(el)el.textContent='';},3000);
}

var state=loadState();
var currentTab='main';

function fmt(n){return new Intl.NumberFormat('ru').format(Math.abs(Math.round(n||0)));}
function fmtD(n){return new Intl.NumberFormat('ru',{maximumFractionDigits:2}).format(n||0);}
function pColor(name){var i=PARTNERS.indexOf(name);return i>=0?PC[i]:'#8b949e';}
function sumBy(type,field,val){return state.entries.filter(function(e){return e.type===type&&(!field||e[field]===val);}).reduce(function(s,e){return s+e.amount;},0);}
function brigName(id){var b=state.brigades.find(function(x){return x.id===id;});return b?b.name:'';}

// ── ГЛАВНЫЕ ВЫЧИСЛЕНИЯ ──
function calcCompany(){
  var income   = sumBy('income');
  var expense  = sumBy('expense');
  var invested = sumBy('invest');
  var returned = sumBy('return');
  var repaid   = sumBy('repay');
  var personal = state.entries.filter(function(e){return e.type==='personal';}).reduce(function(s,e){return s+e.amount;},0);
  var profit   = income - expense;
  var owedToDmitry = invested - returned;
  var toShare  = Math.max(profit - owedToDmitry, 0);
  var shareEach= toShare / 5;
  return {income:income,expense:expense,invested:invested,returned:returned,repaid:repaid,personal:personal,profit:profit,owedToDmitry:owedToDmitry,toShare:toShare,shareEach:shareEach};
}

// ── ПОДОТЧЁТ — кто сколько держит на руках ──
function calcPodotchet(){
  return PARTNERS.map(function(name,i){
    // Получил наличными на руки (invest с полем to === name)
    var given = state.entries.filter(function(e){return e.type==='invest'&&e.to===name;}).reduce(function(s,e){return s+e.amount;},0);
    // Потратил на компанию
    var spent = state.entries.filter(function(e){return e.type==='expense'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
    // Взял лично
    var personal = state.entries.filter(function(e){return e.type==='personal'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
    // Вернул в кассу
    var repaid = state.entries.filter(function(e){return e.type==='repay'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
    // Остаток на руках
    var onHand = given - spent - personal - repaid;
    return {name:name,color:PC[i],given:given,spent:spent,personal:personal,repaid:repaid,onHand:onHand};
  }).filter(function(p){return p.given>0;});
}

// ── ПАРТНЁР ──
function calcPartner(name){
  var invested = sumBy('invest','who',name);
  var returned = sumBy('return','who',name);
  var personal = state.entries.filter(function(e){return e.type==='personal'&&e.who===name;}).reduce(function(s,e){return s+e.amount;},0);
  var C=calcCompany();
  // Подотчёт: деньги на руках тоже надо вернуть в кассу
  var pod=calcPodotchet();
  var myPod=pod.find(function(x){return x.name===name;})||{onHand:0};
  var onHand=Math.max(myPod.onHand,0); // только положительный остаток (деньги на руках)
  // Итого должен вернуть = личные расходы + деньги на руках
  var totalOwed=personal+onHand;
  // К получению = доля - уже взял лично - деньги на руках
  var netPosition=C.shareEach-totalOwed;
  return {name:name,invested:invested,returned:returned,personal:personal,onHand:onHand,totalOwed:totalOwed,shareEach:C.shareEach,netPosition:netPosition};
}

// ── БРИГАДА ──
function calcBrigade(brig){
  var volEntries = state.entries.filter(function(e){return e.type==='vol'&&e.brigade===brig.id;});
  var totalVol   = volEntries.reduce(function(s,e){return s+(e.volume||0);},0);
  var totalEarned= volEntries.reduce(function(s,e){return s+e.amount;},0);
  var paid = state.entries.filter(function(e){return (e.type==='pay'||e.type==='expense')&&e.brigade===brig.id;}).reduce(function(s,e){return s+e.amount;},0);
  var balance = totalEarned - paid;
  var history = volEntries.concat(state.entries.filter(function(e){return (e.type==='pay'||e.type==='expense')&&e.brigade===brig.id;})).sort(function(a,b){return b.date.localeCompare(a.date);});
  return {totalVol:totalVol,totalEarned:totalEarned,paid:paid,balance:balance,history:history,volEntries:volEntries};
}

function badge(type){return '<span class="badge" style="color:'+TC[type]+';background:'+TB[type]+'">'+ICO[type]+' '+LBL[type]+'</span>';}

function descOf(e){
  if(e.type==='invest')   return e.who+(e.to?' → '+e.to:'')+': '+e.note;
  if(e.type==='expense')  return e.note+' ['+e.cat+']'+(e.brigade?' · '+brigName(e.brigade):'');
  if(e.type==='income')   return e.note||'Приход от заказчика';
  if(e.type==='personal') return e.who+' взял лично: '+e.note;
  if(e.type==='return')   return 'Возврат вложений → '+e.who;
  if(e.type==='repay')    return e.who+' вернул в кассу: '+e.note;
  if(e.type==='vol')      return brigName(e.brigade)+': '+fmtD(e.volume)+' м³ × '+fmt(e.rate)+' ₸'+(e.zone?' · '+e.zone:'');
  if(e.type==='pay')      return 'Выплата → '+brigName(e.brigade)+': '+e.note;
  return e.note||'';
}

// ═══ P&L ═══
function renderPL(){
  var C=calcCompany();
  var catMap={};
  state.entries.filter(function(e){return e.type==='expense';}).forEach(function(e){catMap[e.cat]=(catMap[e.cat]||0)+e.amount;});

  var objHTML=OBJECTS.map(function(obj){
    var inc=state.entries.filter(function(e){return e.type==='income'&&e.obj===obj;}).reduce(function(s,e){return s+e.amount;},0);
    var exp=state.entries.filter(function(e){return e.type==='expense'&&e.obj===obj;}).reduce(function(s,e){return s+e.amount;},0);
    var cm={};
    state.entries.filter(function(e){return e.type==='expense'&&e.obj===obj;}).forEach(function(e){cm[e.cat]=(cm[e.cat]||0)+e.amount;});
    var pr=inc-exp;
    return '<div style="margin-bottom:14px">'+
      '<div style="font-family:var(--fd);font-size:15px;color:var(--gold);letter-spacing:1px;margin-bottom:6px">'+obj+'</div>'+
      '<div class="r2"><span class="lb">Доходы</span><span class="vl" style="color:var(--green)">+'+fmt(inc)+' ₸</span></div>'+
      '<div class="r2"><span class="lb">Расходы</span><span class="vl" style="color:var(--red)">−'+fmt(exp)+' ₸</span></div>'+
      '<div class="divider"></div>'+
      '<div class="r2"><span class="lb" style="font-weight:700;color:var(--text)">Прибыль объекта</span><span class="vl" style="color:'+(pr>=0?'var(--green)':'var(--red)')+';font-size:13px">'+fmt(pr)+' ₸</span></div>'+
      Object.entries(cm).sort(function(a,b){return b[1]-a[1];}).map(function(cv){return '<div class="r2" style="font-size:10px"><span class="lb" style="padding-left:10px">· '+cv[0]+'</span><span style="color:var(--red)">−'+fmt(cv[1])+' ₸</span></div>';}).join('')+

  return '<div class="shdr"><h2>P&L</h2><span style="font-size:10px;color:var(--mut)">Прибыль и убытки</span></div>'+
  '<div class="card">'+objHTML+'</div>'+
  '<div class="card">'+
    '<div class="ctit">Итого по компании</div>'+
    '<div class="r2"><span class="lb">▲ Все доходы</span><span class="vl" style="color:var(--green)">'+fmt(C.income)+' ₸</span></div>'+
    Object.entries(catMap).sort(function(a,b){return b[1]-a[1];}).map(function(cv){return '<div class="r2" style="font-size:10px"><span class="lb" style="padding-left:10px">· '+cv[0]+'</span><span style="color:var(--red)">−'+fmt(cv[1])+' ₸</span></div>';}).join('')+
    '<div class="r2"><span class="lb">▼ Все расходы</span><span class="vl" style="color:var(--red)">−'+fmt(C.expense)+' ₸</span></div>'+
    '<div class="divider"></div>'+
    '<div class="r2"><span class="lb" style="font-weight:700;color:var(--text)">ПРИБЫЛЬ</span><span class="vl" style="color:'+(C.profit>=0?'var(--green)':'var(--red)')+';font-size:16px">'+fmt(C.profit)+' ₸</span></div>'+
    '<div class="divider"></div>'+
    '<div class="ctit" style="margin-top:8px">БАЛАНС</div>'+
    '<div class="r2"><span class="lb">Вложения Дмитрия</span><span class="vl" style="color:var(--blue)">'+fmt(C.invested)+' ₸</span></div>'+
    '<div class="r2"><span class="lb">Личные изъятия партнёров</span><span class="vl" style="color:var(--purple)">−'+fmt(C.personal)+' ₸</span></div>'+
    '<div class="r2"><span class="lb">Возвращено Дмитрию</span><span class="vl" style="color:var(--mut)">−'+fmt(C.returned)+' ₸</span></div>'+
    '<div class="r2"><span class="lb">Возвращено в кассу</span><span class="vl" style="color:var(--mut)">+'+fmt(C.repaid)+' ₸</span></div>'+
    '<div class="divider"></div>'+
    '<div class="r2"><span class="lb" style="font-weight:700;color:var(--text)">Остаток в обороте</span><span class="vl" style="color:var(--gold);font-size:14px">'+fmt(C.invested-C.returned+C.repaid-C.expense+C.income-C.personal)+' ₸</span></div>'+
  '</div>';
}

      '<div class="r2"><span class="lb">🧾 Расходы компании</span><span class="vl" style="color:var(--red)">'+fmt(C.expense)+' ₸</span></div>'+
      '<div class="divider"></div>'+
      '<div class="r2"><span class="lb">📊 Прибыль</span><span class="vl" style="color:'+(C.profit>=0?'var(--green)':'var(--red)')+'">'+fmt(C.profit)+' ₸</span></div>'+
      '<div class="r2"><span class="lb">🔄 Вернуть Дмитрию (вложения)</span><span class="vl" style="color:var(--blue)">'+fmt(C.owedToDmitry)+' ₸</span></div>'+
      '<div class="divider"></div>'+
      '<div class="r2"><span class="lb" style="font-weight:700;color:var(--text)">Делится поровну на 5</span><span class="vl" style="color:var(--gold);font-size:15px">'+fmt(C.toShare)+' ₸</span></div>'+

    '</div>';

  var cardsHTML=PARTNERS.map(function(p,i){
    var P=calcPartner(p);
    var podP=pod.find(function(x){return x.name===p;})||{given:0,spent:0,personal:0,repaid:0,onHand:0};

    // Сколько должен вернуть в кассу = личные + деньги на руках
    var mustReturn=P.personal+P.onHand;
    // К получению = доля - долг
    var toGet=C.shareEach - mustReturn;
    // Если инвестор (Дмитрий) — ещё добавляем возврат вложений
    var totalGet=toGet+(P.invested-P.returned);

    var finalColor=totalGet>0?'var(--green)':totalGet<0?'var(--red)':'var(--mut)';
    var finalLabel=totalGet>0?'К ПОЛУЧЕНИЮ':'К ВОЗВРАТУ В КАССУ';

    return '<div class="pcard" style="border-top:3px solid '+PC[i]+'">'+

      // Шапка
      '<div class="phdr">'+
        '<div>'+
          '<div class="pname" style="color:'+PC[i]+'">'+p+'</div>'+
          (P.invested>0?'<div style="font-size:9px;color:var(--blue);margin-top:1px">💼 Инвестор · вложил '+fmt(P.invested)+' ₸</div>':
           '<div style="font-size:9px;color:var(--mut);margin-top:1px">Партнёр · доля 1/5</div>')+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:8px;color:var(--mut);text-transform:uppercase;letter-spacing:1px">Доля прибыли</div>'+
          '<div style="font-family:var(--fd);font-size:20px;color:var(--gold)">'+fmt(C.shareEach)+' ₸</div>'+
        '</div>'+
      '</div>'+

      '<div class="pbody">'+

        // Блок вложений (только если вкладывал)
        (P.invested>0?
        '<div style="background:var(--bllt);border-radius:8px;padding:10px;margin-bottom:8px">'+
          '<div style="font-size:9px;color:var(--blue);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">💼 Вложения в компанию</div>'+
          '<div class="r2"><span class="lb">Вложил своих денег</span><span class="vl" style="color:var(--blue)">'+fmt(P.invested)+' ₸</span></div>'+
          '<div class="r2"><span class="lb">Уже возвращено</span><span class="vl" style="color:var(--green)">'+fmt(P.returned)+' ₸</span></div>'+
          '<div style="border-top:1px solid var(--brd);margin-top:6px;padding-top:6px" class="r2">'+
            '<span class="lb" style="color:var(--text);font-weight:700">Ещё вернуть</span>'+
            '<span class="vl" style="color:var(--blue);font-size:14px">'+fmt(P.invested-P.returned)+' ₸</span>'+
          '</div>'+
        '</div>':'') +

        // Блок подотчёта (только если получал деньги на руки)
        (podP.given>0?
        '<div style="background:var(--olt);border-radius:8px;padding:10px;margin-bottom:8px">'+
          '<div style="font-size:9px;color:var(--orange);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">📤 Подотчёт (деньги на руках)</div>'+
          '<div class="r2"><span class="lb">Получил наличными</span><span class="vl" style="color:var(--orange)">'+fmt(podP.given)+' ₸</span></div>'+
          '<div class="r2"><span class="lb">Потратил на компанию</span><span class="vl" style="color:var(--red)">−'+fmt(podP.spent)+' ₸</span></div>'+
          (podP.personal>0?'<div class="r2"><span class="lb">Взял лично (из подотчёта)</span><span class="vl" style="color:var(--purple)">−'+fmt(podP.personal)+' ₸</span></div>':'')+
          (podP.repaid>0?'<div class="r2"><span class="lb">Вернул в кассу</span><span class="vl" style="color:var(--green)">−'+fmt(podP.repaid)+' ₸</span></div>':'')+
          '<div style="border-top:1px solid var(--brd);margin-top:6px;padding-top:6px" class="r2">'+
            '<span class="lb" style="color:var(--text);font-weight:700">Остаток на руках</span>'+
            '<span class="vl" style="color:'+(podP.onHand>0?'var(--red)':'var(--green)')+';font-size:14px">'+fmt(podP.onHand)+' ₸</span>'+
          '</div>'+
        '</div>':'') +

        // Блок доли и личных расходов
        '<div style="background:var(--s2);border-radius:8px;padding:10px;margin-bottom:8px">'+
          '<div style="font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">📊 Доля и личные расходы</div>'+
          '<div class="r2"><span class="lb">Доля прибыли (1/5)</span><span class="vl" style="color:var(--gold)">'+fmt(C.shareEach)+' ₸</span></div>'+
          (P.personal>0?
            '<div class="r2"><span class="lb">👤 Взял на личные расходы</span><span class="vl" style="color:var(--purple)">'+fmt(P.personal)+' ₸</span></div>':'')+
          (P.onHand>0?
            '<div class="r2"><span class="lb">📤 На руках (вернуть в кассу)</span><span class="vl" style="color:var(--red)">'+fmt(P.onHand)+' ₸</span></div>':'')+
          (mustReturn>0?
            '<div style="border-top:1px solid var(--brd);margin-top:6px;padding-top:6px" class="r2">'+
              '<span class="lb" style="color:var(--text);font-weight:700">Всего должен в кассу</span>'+
              '<span class="vl" style="color:var(--red);font-size:14px">'+fmt(mustReturn)+' ₸</span>'+
            '</div>':'')+
        '</div>'+

        // Итоговый блок — самый важный
        '<div style="border-radius:10px;padding:12px;border:2px solid '+(totalGet>=0?'var(--green)':'var(--red)')+';background:'+(totalGet>=0?'var(--grlt)':'var(--rlt)')+'">'+
          '<div style="font-size:9px;color:'+(totalGet>=0?'var(--green)':'var(--red)')+';letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">🏁 Итоговый расчёт</div>'+
          (P.invested>0?
            '<div class="r2"><span class="lb">Возврат вложений</span><span class="vl" style="color:var(--blue)">+'+fmt(P.invested-P.returned)+' ₸</span></div>':'')+
          '<div class="r2"><span class="lb">Доля прибыли</span><span class="vl" style="color:var(--gold)">+'+fmt(C.shareEach)+' ₸</span></div>'+
          (P.personal>0?
            '<div class="r2"><span class="lb">Взял лично</span><span class="vl" style="color:var(--purple)">−'+fmt(P.personal)+' ₸</span></div>':'')+
          (P.onHand>0?
            '<div class="r2"><span class="lb">На руках</span><span class="vl" style="color:var(--red)">−'+fmt(P.onHand)+' ₸</span></div>':'')+
          '<div style="border-top:2px solid '+(totalGet>=0?'var(--green)':'var(--red)')+';margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;align-items:center">'+
            '<span style="font-size:12px;font-weight:700;color:'+(totalGet>=0?'var(--green)':'var(--red)')+'">'+finalLabel+'</span>'+
            '<span style="font-family:var(--fd);font-size:26px;color:'+(totalGet>=0?'var(--green)':'var(--red)')+'">'+fmt(Math.abs(totalGet))+' ₸</span>'+
          '</div>'+
        '</div>'+

      '</div>'+
    '</div>';
  }).join('');

  return '<div class="shdr"><h2>ПАРТНЁРЫ</h2><span style="font-size:10px;color:var(--mut)">5 партнёров · LionGate Construction</span></div>'+
    summaryHTML+cardsHTML;
}

// ═══ БРИГАДЫ ═══
function renderBrigades(){
  var html='<div class="shdr"><h2>БРИГАДЫ</h2>'+(role==='editor'?'<button class="fedit" onclick="openAddBrigadeModal()" style="color:var(--teal);border-color:var(--teal)">+ Бригада</button>':'')+'</div>'+
  '<div class="infobox" style="border-color:var(--teal);background:var(--tlt);color:var(--mut)">👷 Начислено = объём (м³) × расценка. Остаток = начислено − выплачено.</div>';

  state.brigades.forEach(function(b){
    var B=calcBrigade(b);
    var bc=B.balance>0?'var(--red)':B.balance<0?'var(--green)':'var(--mut)';
    var btxt=B.balance>0?'Долг: '+fmt(B.balance)+' ₸':B.balance<0?'Переплата: '+fmt(Math.abs(B.balance))+' ₸':'Расчёт закрыт';
    var pct=B.totalEarned?Math.min(Math.round(B.paid/B.totalEarned*100),100):0;

    var rateMap={};
    B.volEntries.forEach(function(e){
      var key=(e.rate||0)+'_'+(e.zone||'');
      if(!rateMap[key])rateMap[key]={rate:e.rate||0,zone:e.zone||'',vol:0,earned:0};
      rateMap[key].vol+=(e.volume||0);
      rateMap[key].earned+=e.amount;
    });

    html+='<div class="bcard">'+
      '<div class="bhdr">'+
        '<div><div class="bname">'+b.name+'</div><div style="font-size:10px;color:var(--mut)">'+b.spec+' · '+b.obj.split('—')[0].trim()+'</div></div>'+
        (role==='editor'?'<button class="fedit" onclick="openEditBrigadeModal(\''+b.id+'\')">✏️ Ред.</button>':'')+
      '</div>'+
      '<div class="bbody">'+
        '<div class="kg3" style="margin-bottom:10px">'+
          '<div class="kpi" style="border-color:var(--teal);padding:8px 10px"><div class="klbl">Объём</div><div class="kval" style="font-size:16px;color:var(--teal)">'+fmtD(B.totalVol)+'</div><div class="ksub">м³</div></div>'+
          '<div class="kpi" style="border-color:var(--gold);padding:8px 10px"><div class="klbl">Начислено</div><div class="kval" style="font-size:16px;color:var(--gold)">'+fmt(B.totalEarned)+'</div><div class="ksub">₸</div></div>'+
          '<div class="kpi" style="border-color:var(--green);padding:8px 10px"><div class="klbl">Выплачено</div><div class="kval" style="font-size:16px;color:var(--green)">'+fmt(B.paid)+'</div><div class="ksub">₸</div></div>'+
        '</div>'+
        '<div class="bar" style="height:7px;margin-bottom:4px"><div class="barfill" style="width:'+pct+'%;background:var(--teal)"></div></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-bottom:10px">'+
          '<span>выплачено '+pct+'%</span>'+
          '<span style="color:'+bc+';font-weight:700">'+btxt+'</span>'+
        '</div>'+
        (Object.keys(rateMap).length>0?
          '<div class="sdiv">Расценки и пятна</div>'+
          Object.values(rateMap).map(function(r){
            return '<div class="r2" style="font-size:10px"><span class="lb">'+(r.zone||'Основной объём')+' · '+fmt(r.rate)+' ₸/м³</span><span style="color:var(--teal)">'+fmtD(r.vol)+' м³ = '+fmt(r.earned)+' ₸</span></div>';
          }).join(''):'')  +
        (B.history.length>0?
          '<div class="sdiv">История</div>'+
          B.history.map(function(e){
            return '<div class="r2" style="font-size:10px">'+
              '<span class="lb">'+e.date+' · '+(e.type==='vol'?'📐 '+fmtD(e.volume)+' м³ × '+fmt(e.rate)+' ₸':e.type==='pay'?'💸 Выплата':'💸 Аванс')+(e.zone?' · '+e.zone:'')+(e.note?' · '+e.note:'')+'</span>'+
              '<span style="color:'+(e.type==='vol'?'var(--gold)':'var(--green)')+'">'+fmt(e.amount)+' ₸</span>'+
            '</div>';
          }).join(''):'') +
        (role==='editor'?
          '<div style="display:flex;gap:8px;margin-top:12px">'+
            '<button onclick="openVolModal(\''+b.id+'\')" style="flex:1;background:var(--tlt);border:1px solid var(--teal);color:var(--teal);border-radius:8px;padding:9px;font-family:var(--fm);font-size:11px;cursor:pointer">📐 Внести объём</button>'+
            '<button onclick="openPayModal(\''+b.id+'\')" style="flex:1;background:var(--grlt);border:1px solid var(--green);color:var(--green);border-radius:8px;padding:9px;font-family:var(--fm);font-size:11px;cursor:pointer">💸 Выплатить</button>'+
          '</div>':'')+
      '</div>'+
    '</div>';
  });
  return html;
}

// ═══ ДВИЖЕНИЕ ═══
function renderCash(){
  var sorted=[].concat(state.entries).filter(function(e){return e.type!=='vol';}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var run=0;
  var rows=sorted.map(function(e){
    var sign=(e.type==='income'||e.type==='invest'||e.type==='repay')?1:-1;
    run+=sign*e.amount;
    return Object.assign({},e,{sign:sign,running:run});
  }).reverse();

  return '<div class="shdr"><h2>ДВИЖЕНИЕ</h2><span style="font-size:11px;font-weight:700;color:'+(run>=0?'var(--green)':'var(--red)')+'">касса: '+fmt(run)+' ₸</span></div>'+
  '<div class="card" style="padding:0 14px">'+
    rows.map(function(e){
      return '<div class="oprow">'+
        '<div class="opbody">'+
          '<div style="margin-bottom:3px">'+badge(e.type)+'</div>'+
          '<div class="opdesc">'+descOf(e)+'</div>'+
          '<div class="opmeta">'+e.date+(e.obj&&e.obj!=='-'?' · '+e.obj.split('—')[0].trim():'')+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:12px;font-weight:700;color:'+(TC[e.type]||'var(--mut)')+'">'+(e.sign>0?'+':'-')+fmt(e.amount)+' ₸</div>'+
          '<div style="font-size:9px;color:'+(e.running>=0?'var(--mut)':'var(--red)')+'">касса: '+fmt(e.running)+' ₸</div>'+
        '</div>'+
      '</div>';
    }).join('')+
  '</div>';
}

// ═══ ЖУРНАЛ ═══
function renderJournal(){
  var sorted=[].concat(state.entries).sort(function(a,b){return b.date.localeCompare(a.date);});
  return '<div class="shdr"><h2>ЖУРНАЛ</h2><span style="font-size:11px;color:var(--mut)">'+sorted.length+' записей</span></div>'+
  '<div class="card" style="padding:0 14px">'+
    (sorted.length?sorted.map(function(e){return opRow(e,true);}).join(''):'<div class="empty">Нет записей</div>')+
  '</div>';
}

// ═══ МОДАЛ ═══
var selType='expense';
function openModal(){if(role!=='editor')return;selType='expense';buildModal();document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}

function buildModal(){
  var today=new Date().toISOString().slice(0,10);
  var parOpts=PARTNERS.map(function(p){return '<option>'+p+'</option>';}).join('');
  var catOpts=EXP_CATS.map(function(c){return '<option>'+c+'</option>';}).join('');
  var objOpts=OBJECTS.map(function(o){return '<option>'+o+'</option>';}).join('');
  var brigOpts=state.brigades.map(function(b){return '<option value="'+b.id+'">'+b.name+' ('+b.spec+')</option>';}).join('');

  var types=[
    {key:'expense', cls:'tc-exp',ico:'🧾',tit:'Потратили',       dsc:'Расход компании: материалы, зарплата...'},
    {key:'invest',  cls:'tc-inv',ico:'💼',tit:'Вложил деньги',   dsc:'Партнёр вложил свои деньги в проект'},
    {key:'income',  cls:'tc-inc',ico:'💰',tit:'Получили деньги', dsc:'Пришла оплата от заказчика'},
    {key:'personal',cls:'tc-per',ico:'👤',tit:'Взял лично',      dsc:'Партнёр взял деньги себе (из своей доли)'},
    {key:'return',  cls:'tc-ret',ico:'🔄',tit:'Вернули вложение',dsc:'Вернули партнёру его вложенные деньги'},
    {key:'repay',   cls:'tc-rep',ico:'💵',tit:'Вернул в кассу',  dsc:'Сотрудник вернул остаток подотчёта в кассу'},
  ];
  var tcols=types.map(function(t){
    return '<div class="tcard '+t.cls+(selType===t.key?' sel':'')+'" onclick="selType=\''+t.key+'\';buildModal()">'+
      '<div class="tic">'+t.ico+'</div>'+
      '<div class="ttit" style="color:'+(TC[t.key]||'var(--mut)')+'">'+t.tit+'</div>'+
      '<div class="tdsc">'+t.dsc+'</div>'+
    '</div>';
  }).join('');

  var fields='';
  if(selType==='expense') fields=
    '<div class="fg"><label class="fl">Объект</label><select class="fi" id="f-obj">'+objOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Статья расхода</label><select class="fi" id="f-cat">'+catOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Кто потратил</label><select class="fi" id="f-who">'+parOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Что куплено / на что</label><input class="fi" id="f-note" type="text" placeholder="Арматура, аванс бригаде..."/></div>'+
    '<div class="fg"><label class="fl">Бригада (если аванс бригаде)</label><select class="fi" id="f-brig"><option value="">— не относится к бригаде</option>'+brigOpts+'</select></div>';
  else if(selType==='invest') fields=
    '<div class="fg"><label class="fl">Кто вложил / выдал</label><select class="fi" id="f-who">'+parOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Кому выдал наличными (если выдавал)</label><select class="fi" id="f-to"><option value="">— никому, оплатил напрямую</option>'+parOpts+'</select></div>'+
    '<div class="fg"><label class="fl">На что пошли деньги</label><input class="fi" id="f-note" type="text" placeholder="На расходы по объекту..."/></div>';
  else if(selType==='income') fields=
    '<div class="fg"><label class="fl">Объект</label><select class="fi" id="f-obj">'+objOpts+'</select></div>'+
    '<div class="fg"><label class="fl">От кого</label><input class="fi" id="f-from" type="text" placeholder="Sensata Group" value="Sensata Group"/></div>'+
    '<div class="fg"><label class="fl">Примечание</label><input class="fi" id="f-note" type="text" placeholder="КС-2 №1, аванс 30%..."/></div>';
  else if(selType==='personal') fields=
    '<div class="fg"><label class="fl">Кто взял</label><select class="fi" id="f-who">'+parOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Примечание</label><input class="fi" id="f-note" type="text" placeholder="На личные нужды..."/></div>';
  else if(selType==='return') fields=
    '<div class="fg"><label class="fl">Кому вернули</label><select class="fi" id="f-who">'+parOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Примечание</label><input class="fi" id="f-note" type="text" placeholder="Возврат вложений..."/></div>';
  else if(selType==='repay') fields=
    '<div class="fg"><label class="fl">Кто вернул в кассу</label><select class="fi" id="f-who">'+parOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Примечание</label><input class="fi" id="f-note" type="text" placeholder="Возврат остатка подотчёта..."/></div>';

  document.getElementById('mbody').innerHTML=
    '<div class="tgrid">'+tcols+'</div>'+
    '<div class="frow">'+
      '<div class="fg"><label class="fl">Дата</label><input class="fi" id="f-date" type="date" value="'+today+'"/></div>'+
      '<div class="fg"><label class="fl">Сумма (₸)</label><input class="fi" id="f-amount" type="number" placeholder="0" inputmode="numeric"/></div>'+
    '</div>'+
    fields+
    '<button class="fsave" onclick="saveEntry()">СОХРАНИТЬ</button>'+
    '<button class="fcanc" onclick="closeModal()">Отмена</button>';
}

function saveEntry(){
  var amount=parseFloat(document.getElementById('f-amount')&&document.getElementById('f-amount').value);
  if(!amount||isNaN(amount)){alert('Введите сумму');return;}
  var e={id:Date.now(),date:(document.getElementById('f-date')&&document.getElementById('f-date').value)||new Date().toISOString().slice(0,10),type:selType,amount:amount,note:(document.getElementById('f-note')&&document.getElementById('f-note').value)||''};
  if(selType==='expense'){e.obj=(document.getElementById('f-obj')&&document.getElementById('f-obj').value)||OBJECTS[0];e.cat=(document.getElementById('f-cat')&&document.getElementById('f-cat').value)||'';e.who=(document.getElementById('f-who')&&document.getElementById('f-who').value)||'';var bv=document.getElementById('f-brig')&&document.getElementById('f-brig').value;if(bv)e.brigade=bv;}
  if(selType==='invest'){e.who=(document.getElementById('f-who')&&document.getElementById('f-who').value)||'';e.obj=OBJECTS[0];var tv=document.getElementById('f-to')&&document.getElementById('f-to').value;if(tv)e.to=tv;else e.to='';}
  if(selType==='income'){e.obj=(document.getElementById('f-obj')&&document.getElementById('f-obj').value)||OBJECTS[0];e.from=(document.getElementById('f-from')&&document.getElementById('f-from').value)||'';}
  if(selType==='personal'){e.who=(document.getElementById('f-who')&&document.getElementById('f-who').value)||'';e.obj='-';}
  if(selType==='return'){e.who=(document.getElementById('f-who')&&document.getElementById('f-who').value)||'';e.obj='-';}
  if(selType==='repay'){e.who=(document.getElementById('f-who')&&document.getElementById('f-who').value)||'';e.obj='-';}
  state.entries.push(e);save();closeModal();render();
}

function calcVolPreview(){
  var vol=parseFloat(document.getElementById('f-vol')&&document.getElementById('f-vol').value)||0;
  var rate=parseFloat(document.getElementById('f-rate')&&document.getElementById('f-rate').value)||0;
  var sum=vol*rate;
  var el=document.getElementById('vol-preview');
  if(el)el.innerHTML='<span style="color:var(--teal)">'+fmtD(vol)+' м³ × '+fmt(rate)+' ₸/м³ = <b style="font-size:14px">'+fmt(sum)+' ₸</b></span>';
}

function saveVol(brigId){
  var vol=parseFloat(document.getElementById('f-vol')&&document.getElementById('f-vol').value);
  var rate=parseFloat(document.getElementById('f-rate')&&document.getElementById('f-rate').value);
  if(!vol||isNaN(vol)){alert('Введите объём');return;}
  if(!rate||isNaN(rate)){alert('Введите расценку');return;}
  var e={id:Date.now(),date:(document.getElementById('f-date')&&document.getElementById('f-date').value)||new Date().toISOString().slice(0,10),type:'vol',brigade:brigId,volume:vol,rate:rate,amount:Math.round(vol*rate),zone:(document.getElementById('f-zone')&&document.getElementById('f-zone').value)||'',note:(document.getElementById('f-note')&&document.getElementById('f-note').value)||'',obj:OBJECTS[0]};
  state.entries.push(e);
  var brig=state.brigades.find(function(x){return x.id===brigId;});
  if(brig)brig.rate=rate;
  save();closeModal();render();
}

function saveBrigade(){
  var name=document.getElementById('f-bname')&&document.getElementById('f-bname').value.trim();
  if(!name){alert('Введите название');return;}
  var b={id:'b'+Date.now(),name:name,spec:(document.getElementById('f-bspec')&&document.getElementById('f-bspec').value)||'',obj:(document.getElementById('f-bobj')&&document.getElementById('f-bobj').value)||OBJECTS[0],rate:parseFloat(document.getElementById('f-brate')&&document.getElementById('f-brate').value)||0,unit:'м³'};
  state.brigades.push(b);save();closeModal();render();
}

function openEditBrigadeModal(brigId){
  var b=state.brigades.find(function(x){return x.id===brigId;});
  var objOpts=OBJECTS.map(function(o){return '<option'+(o===b.obj?' selected':'')+'>'+o+'</option>';}).join('');
  document.getElementById('mtit').textContent='✏️ РЕДАКТИРОВАТЬ БРИГАДУ';
  document.getElementById('mbody').innerHTML=
    '<div class="fg"><label class="fl">Название бригады</label><input class="fi" id="f-bname" type="text" value="'+b.name+'"/></div>'+
    '<div class="fg"><label class="fl">Специализация</label><input class="fi" id="f-bspec" type="text" value="'+b.spec+'"/></div>'+
    '<div class="fg"><label class="fl">Объект</label><select class="fi" id="f-bobj">'+objOpts+'</select></div>'+
    '<div class="fg"><label class="fl">Расценка по умолчанию (₸/м³)</label><input class="fi" id="f-brate" type="number" value="'+(b.rate||0)+'" inputmode="numeric"/></div>'+
    '<button class="fsave" style="background:var(--teal)" onclick="updateBrigade(\''+brigId+'\')">СОХРАНИТЬ</button>'+
    '<button class="fcanc" style="color:var(--red);border-color:var(--red)" onclick="deleteBrigade(\''+brigId+'\')">Удалить бригаду</button>'+
    '<button class="fcanc" onclick="closeModal()">Отмена</button>';
  document.getElementById('modal').style.display='flex';
}

function updateBrigade(brigId){
  var b=state.brigades.find(function(x){return x.id===brigId;});if(!b)return;
  b.name=(document.getElementById('f-bname')&&document.getElementById('f-bname').value.trim())||b.name;
  b.spec=(document.getElementById('f-bspec')&&document.getElementById('f-bspec').value)||b.spec;
  b.obj=(document.getElementById('f-bobj')&&document.getElementById('f-bobj').value)||b.obj;
  b.rate=parseFloat(document.getElementById('f-brate')&&document.getElementById('f-brate').value)||b.rate;
  save();closeModal();render();
}

function deleteBrigade(brigId){
  if(!confirm('Удалить бригаду?'))return;
  state.brigades=state.brigades.filter(function(x){return x.id!==brigId;});
  save();closeModal();render();
}

function delEntry(id){
  if(role!=='editor')return;
  if(!confirm('Удалить запись?'))return;
  state.entries=state.entries.filter(function(e){return e.id!==id;});
  save();render();
}

// ═══ ЭКСПОРТ В EXCEL ═══
function exportExcel(){
  if(typeof XLSX==='undefined'){alert('Загрузка библиотеки... попробуйте ещё раз');return;}
  var wb=XLSX.utils.book_new();
  var C=calcCompany();
  var pod=calcPodotchet();

  // ── Лист 1: Все операции ──
  var ops=[['Дата','Тип','Объект','Категория','Кто','Сумма (₸)','Примечание']];
  var sorted=[].concat(state.entries).sort(function(a,b){return a.date.localeCompare(b.date);});
  sorted.forEach(function(e){
    ops.push([
      e.date,
      LBL_M[e.type]||e.type,
      e.obj&&e.obj!=='-'?e.obj:'—',
      e.cat||e.cat||'—',
      e.who||(e.to?e.who+'→'+e.to:'')||'—',
      e.amount,
      e.note||''
    ]);
  });
  var ws1=XLSX.utils.aoa_to_sheet(ops);
  ws1['!cols']=[{wch:12},{wch:18},{wch:28},{wch:24},{wch:20},{wch:14},{wch:32}];
  XLSX.utils.book_append_sheet(wb,ws1,'Все операции');

  // ── Лист 2: P&L ──
  var pl=[
    ['P&L — LIONGATE Construction'],
    [''],
    ['ПОКАЗАТЕЛЬ','СУММА (₸)'],
    ['Доходы от заказчика', C.income],
    ['Расходы компании', C.expense],
    ['Прибыль / убыток', C.profit],
    [''],
    ['Вложено Дмитрием', C.invested],
    ['Возвращено Дмитрию', C.returned],
    ['Осталось вернуть', C.owedToDmitry],
    [''],
    ['Делится между партнёрами', C.toShare],
    ['Доля каждого (1/5)', C.shareEach],
  ];
  // Расходы по категориям
  pl.push([''],['РАСХОДЫ ПО КАТЕГОРИЯМ','']);
  var catMap={};
  state.entries.filter(function(e){return e.type==='expense';}).forEach(function(e){catMap[e.cat]=(catMap[e.cat]||0)+e.amount;});
  Object.entries(catMap).sort(function(a,b){return b[1]-a[1];}).forEach(function(cv){
    pl.push([cv[0],cv[1]]);
  });
  var ws2=XLSX.utils.aoa_to_sheet(pl);
  ws2['!cols']=[{wch:32},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws2,'P&L');

  // ── Лист 3: Партнёры ──
  var partners=[
    ['ПАРТНЁРЫ — РАСЧЁТ'],
    [''],
    ['Партнёр','Вложил (₸)','Взял лично (₸)','На руках (₸)','Долг в кассу (₸)','Доля прибыли (₸)','К получению (₸)'],
  ];
  PARTNERS.forEach(function(p,i){
    var P=calcPartner(p);
    var podP=pod.find(function(x){return x.name===p;})||{given:0,spent:0,personal:0,repaid:0,onHand:0};
    var mustReturn=P.personal+Math.max(podP.onHand,0);
    var totalGet=C.shareEach+(P.invested-P.returned)-mustReturn;
    partners.push([
      p,
      P.invested,
      P.personal,
      Math.max(podP.onHand,0),
      mustReturn,
      C.shareEach,
      totalGet
    ]);
  });
  var ws3=XLSX.utils.aoa_to_sheet(partners);
  ws3['!cols']=[{wch:14},{wch:14},{wch:16},{wch:14},{wch:16},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws3,'Партнёры');

  // ── Лист 4: Бригады ──
  var brig=[['БРИГАДЫ'],[''],['Бригада','Специализация','Объём (м³)','Начислено (₸)','Выплачено (₸)','Остаток (₸)']];
  state.brigades.forEach(function(b){
    var B=calcBrigade(b);
    brig.push([b.name,b.spec,B.totalVol,B.totalEarned,B.paid,B.balance]);
  });
  brig.push([''],['ДЕТАЛИ ОБЪЁМОВ','','','','','']);
  brig.push(['Дата','Бригада','Пятно/зона','Объём (м³)','Расценка (₸/м³)','Начислено (₸)']);
  state.entries.filter(function(e){return e.type==='vol';}).sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    brig.push([e.date,brigName(e.brigade),e.zone||'—',e.volume||0,e.rate||0,e.amount]);
  });
  var ws4=XLSX.utils.aoa_to_sheet(brig);
  ws4['!cols']=[{wch:18},{wch:16},{wch:16},{wch:14},{wch:16},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws4,'Бригады');

  // ── Лист 5: Движение денег ──
  var cf=[['ДВИЖЕНИЕ ДЕНЕГ'],[''],['Дата','Тип','Описание','Приход (₸)','Расход (₸)','Остаток (₸)']];
  var run=0;
  [].concat(state.entries).filter(function(e){return e.type!=='vol';})
    .sort(function(a,b){return a.date.localeCompare(b.date);})
    .forEach(function(e){
      var sign=(e.type==='income'||e.type==='invest'||e.type==='repay')?1:-1;
      run+=sign*e.amount;
      cf.push([
        e.date,
        LBL_M[e.type]||e.type,
        descOf(e),
        sign>0?e.amount:'',
        sign<0?e.amount:'',
        run
      ]);
    });
  var ws5=XLSX.utils.aoa_to_sheet(cf);
  ws5['!cols']=[{wch:12},{wch:18},{wch:36},{wch:14},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws5,'Движение денег');

  // Сохранить файл
  var date=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,'LIONGATE_'+date+'.xlsx');
}

// INIT
var sr=sessionStorage.getItem('role');if(sr){role=sr;showApp();}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});

// Auto-refresh from cloud every 30 seconds
setInterval(function(){
  if(role){
    loadFromCloud(function(){render();});
  }
},30000);
</script>
