<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0d1117"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Субподряд"/>
  <meta name="description" content="Управленческий учёт субподрядной компании"/>

  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="icon" href="icon-192.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <title>СУБПОДРЯД — Учёт</title>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --surface2:#1c2333;
      --border:  #30363d;
      --gold:    #f0a500;
      --gold-lt: rgba(240,165,0,.12);
      --green:   #2ea043;
      --green-lt:rgba(46,160,67,.12);
      --red:     #da3633;
      --red-lt:  rgba(218,54,51,.12);
      --blue:    #388bfd;
      --blue-lt: rgba(56,139,253,.12);
      --purple:  #8957e5;
      --purple-lt:rgba(137,87,229,.12);
      --text:    #e6edf3;
      --muted:   #8b949e;
      --font-display: 'Bebas Neue', sans-serif;
      --font-mono:    'IBM Plex Mono', monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font-mono); overflow:hidden; }

    /* ── LAYOUT ── */
    #app { display:flex; flex-direction:column; height:100vh; height:100dvh; }

    /* ── HEADER ── */
    header {
      background:var(--surface);
      border-bottom:1px solid var(--border);
      padding:12px 16px 10px;
      display:flex; align-items:center; gap:10px;
      flex-shrink:0;
    }
    .logo { font-family:var(--font-display); font-size:22px; color:var(--gold); letter-spacing:2px; line-height:1; }
    .logo-sub { font-size:9px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-top:1px; }
    .header-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .obj-filter {
      background:var(--surface2); border:1px solid var(--border);
      color:var(--text); font-family:var(--font-mono); font-size:10px;
      padding:5px 8px; border-radius:6px; outline:none; max-width:140px;
    }
    .btn-add-main {
      background:var(--gold); color:#0d1117; border:none;
      font-family:var(--font-display); font-size:16px; letter-spacing:1px;
      padding:6px 14px; border-radius:6px; cursor:pointer;
    }

    /* ── CONTENT ── */
    .content { flex:1; overflow-y:auto; padding:12px 14px 80px; }

    /* ── BOTTOM NAV ── */
    nav {
      position:fixed; bottom:0; left:0; right:0;
      background:var(--surface);
      border-top:1px solid var(--border);
      display:flex; z-index:90;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex:1; display:flex; flex-direction:column; align-items:center;
      padding:8px 4px 6px; cursor:pointer; border:none; background:transparent;
      color:var(--muted); font-family:var(--font-mono); font-size:8px;
      letter-spacing:1px; text-transform:uppercase; gap:3px; transition:color .15s;
    }
    .nav-btn.active { color:var(--gold); }
    .nav-btn .icon { font-size:18px; line-height:1; }
    .nav-btn.active .icon { filter:drop-shadow(0 0 4px var(--gold)); }

    /* ── CARDS ── */
    .card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:14px; margin-bottom:10px;
    }
    .card-title {
      font-size:9px; color:var(--muted); letter-spacing:3px;
      text-transform:uppercase; margin-bottom:10px;
    }

    /* ── KPI GRID ── */
    .kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
    .kpi {
      background:var(--surface); border-radius:10px; padding:12px;
      border-left:3px solid var(--gold); position:relative; overflow:hidden;
    }
    .kpi-label { font-size:8px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
    .kpi-value { font-family:var(--font-display); font-size:22px; letter-spacing:1px; line-height:1.1; }
    .kpi-sub { font-size:9px; color:var(--muted); margin-top:3px; }

    /* ── TABLE ── */
    .tbl { width:100%; border-collapse:collapse; font-size:11px; }
    .tbl th {
      text-align:left; padding:7px 8px; font-size:8px; color:var(--muted);
      letter-spacing:2px; text-transform:uppercase;
      border-bottom:1px solid var(--border); font-weight:400;
    }
    .tbl td { padding:9px 8px; border-bottom:1px solid #1c2333; vertical-align:middle; }
    .tbl tr:last-child td { border-bottom:none; }

    /* ── BADGE ── */
    .badge {
      display:inline-block; padding:2px 7px; border-radius:4px;
      font-size:9px; font-weight:700; letter-spacing:1px;
    }

    /* ── BAR ── */
    .bar-track { background:var(--surface2); border-radius:2px; height:4px; margin-top:5px; }
    .bar-fill { border-radius:2px; height:100%; transition:width .4s ease; }

    /* ── PARTNER CARDS ── */
    .partner-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .partner-card {
      background:var(--surface); border-radius:10px; padding:12px;
      border-top:2px solid;
    }
    .partner-name { font-family:var(--font-display); font-size:18px; letter-spacing:1px; margin-bottom:8px; }
    .partner-row { display:flex; justify-content:space-between; font-size:10px; margin-bottom:4px; }
    .partner-lbl { color:var(--muted); }
    .partner-divider { border-top:1px solid var(--border); margin:8px 0; }

    /* ── CASHFLOW ── */
    .cf-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #1c2333; }
    .cf-icon { font-size:14px; flex-shrink:0; }
    .cf-body { flex:1; min-width:0; }
    .cf-desc { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cf-meta { font-size:9px; color:var(--muted); margin-top:1px; }
    .cf-amount { font-size:12px; font-weight:700; flex-shrink:0; }
    .cf-running { font-size:10px; color:var(--muted); flex-shrink:0; text-align:right; }

    /* ── OBJECT CARD ── */
    .obj-card { margin-bottom:12px; }
    .obj-header {
      background:var(--surface2); border-radius:10px 10px 0 0;
      padding:12px 14px; border:1px solid var(--border); border-bottom:none;
    }
    .obj-name { font-family:var(--font-display); font-size:18px; color:var(--gold); letter-spacing:1px; }
    .obj-meta { font-size:9px; color:var(--muted); margin-top:2px; }
    .obj-kpis { display:grid; grid-template-columns:repeat(3,1fr); }
    .obj-kpi {
      background:var(--surface); border:1px solid var(--border);
      border-top:none; padding:10px; text-align:center;
    }
    .obj-kpi:first-child { border-radius:0 0 0 10px; }
    .obj-kpi:last-child  { border-radius:0 0 10px 0; border-right:1px solid var(--border); }
    .obj-kpi-lbl { font-size:8px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
    .obj-kpi-val { font-family:var(--font-display); font-size:16px; }
    .obj-cats { background:var(--surface); border:1px solid var(--border); border-top:none;
               border-radius:0 0 10px 10px; padding:10px 14px; }
    .obj-cat-row { display:flex; justify-content:space-between; font-size:10px; margin-bottom:3px; color:var(--muted); }
    .obj-cat-row span:last-child { color:var(--red); }

    /* ── MODAL ── */
    .modal-bg {
      position:fixed; inset:0; background:rgba(0,0,0,.7);
      display:flex; align-items:flex-end; justify-content:center;
      z-index:200; backdrop-filter:blur(4px);
    }
    .modal-box {
      background:var(--surface); border-radius:20px 20px 0 0;
      padding:20px 16px calc(20px + env(safe-area-inset-bottom));
      width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
    }
    .modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px; }
    .modal-title { font-family:var(--font-display); font-size:22px; color:var(--gold); letter-spacing:2px; margin-bottom:16px; }
    .form-group { margin-bottom:12px; }
    .form-label { font-size:9px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-bottom:5px; display:block; }
    .form-input {
      width:100%; background:var(--surface2); border:1px solid var(--border);
      border-radius:8px; padding:11px 12px; color:var(--text);
      font-family:var(--font-mono); font-size:14px; outline:none;
      transition:border-color .15s;
    }
    .form-input:focus { border-color:var(--gold); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btn-save {
      width:100%; background:var(--gold); color:#0d1117; border:none;
      font-family:var(--font-display); font-size:20px; letter-spacing:2px;
      padding:14px; border-radius:10px; cursor:pointer; margin-top:8px;
    }
    .btn-cancel {
      width:100%; background:transparent; color:var(--muted);
      border:1px solid var(--border); font-family:var(--font-mono); font-size:12px;
      padding:10px; border-radius:10px; cursor:pointer; margin-top:6px;
    }

    /* TYPE SELECTOR */
    .type-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; }
    .type-btn {
      padding:10px 4px; border-radius:8px; border:1px solid var(--border);
      background:var(--surface2); color:var(--muted); font-family:var(--font-mono);
      font-size:10px; cursor:pointer; text-align:center; transition:all .15s;
    }
    .type-btn.selected-income  { background:var(--green-lt);  border-color:var(--green);  color:var(--green); }
    .type-btn.selected-expense { background:var(--red-lt);    border-color:var(--red);    color:var(--red); }
    .type-btn.selected-contrib { background:var(--blue-lt);   border-color:var(--blue);   color:var(--blue); }
    .type-btn.selected-withdraw{ background:var(--purple-lt); border-color:var(--purple); color:var(--purple); }

    /* EMPTY STATE */
    .empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:12px; }
    .empty-icon { font-size:36px; margin-bottom:8px; opacity:.4; }

    /* SECTION HEADER */
    .section-hdr {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:10px;
    }
    .section-hdr h2 { font-family:var(--font-display); font-size:20px; letter-spacing:1px; color:var(--text); }
    .section-total { font-size:12px; color:var(--muted); }

    /* DEL btn */
    .del-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      border-radius:4px; padding:2px 7px; font-size:10px; cursor:pointer;
    }

    /* INSTALL BANNER */
    #install-banner {
      display:none; position:fixed; top:0; left:0; right:0; z-index:300;
      background:var(--gold); color:#0d1117; padding:10px 16px;
      font-size:12px; align-items:center; gap:10px;
    }
    #install-banner.show { display:flex; }
    #install-banner button {
      margin-left:auto; background:#0d1117; color:var(--gold);
      border:none; border-radius:6px; padding:5px 12px;
      font-family:var(--font-mono); font-size:11px; font-weight:700; cursor:pointer;
    }

    /* SCROLLBAR */
    .content::-webkit-scrollbar { width:3px; }
    .content::-webkit-scrollbar-track { background:transparent; }
    .content::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    @media (min-width:600px) {
      .kpi-grid { grid-template-columns:repeat(3,1fr); }
      .partner-grid { grid-template-columns:repeat(3,1fr); }
    }
  </style>
</head>
<body>
<div id="install-banner">
  <span>📲 Установите приложение на рабочий стол</span>
  <button id="install-btn">Установить</button>
  <button onclick="document.getElementById('install-banner').classList.remove('show')" style="background:transparent;color:#0d1117;border:none;font-size:18px;cursor:pointer;">✕</button>
</div>

<div id="app">
  <header>
    <div>
      <div class="logo">СУБПОДРЯД</div>
      <div class="logo-sub">ИНТЕКС · 5 партнёров</div>
    </div>
    <div class="header-right">
      <select class="obj-filter" id="obj-filter" onchange="render()">
        <option value="all">Все объекты</option>
      </select>
      <button class="btn-add-main" onclick="openModal()">+</button>
    </div>
  </header>

  <div class="content" id="content"></div>

  <nav>
    <button class="nav-btn active" onclick="setTab('dashboard')" id="tab-dashboard">
      <span class="icon">◈</span><span>Сводка</span>
    </button>
    <button class="nav-btn" onclick="setTab('cashflow')" id="tab-cashflow">
      <span class="icon">⇅</span><span>Движение</span>
    </button>
    <button class="nav-btn" onclick="setTab('objects')" id="tab-objects">
      <span class="icon">◧</span><span>Объекты</span>
    </button>
    <button class="nav-btn" onclick="setTab('partners')" id="tab-partners">
      <span class="icon">◉</span><span>Партнёры</span>
    </button>
    <button class="nav-btn" onclick="setTab('journal')" id="tab-journal">
      <span class="icon">≡</span><span>Журнал</span>
    </button>
  </nav>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">НОВАЯ ЗАПИСЬ</div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// DATA & STATE
// ══════════════════════════════════════════════════════
const PARTNERS = ["Дмитрий","Бекжан","Евгений","Нурсултан","Сергей"];
const P_COLORS = ["#f0a500","#2ea043","#388bfd","#8957e5","#da3633"];

const EXP_CATS = ["Материалы","Зарплата рабочих","ФОТ ИТР","Аренда техники",
  "Транспорт","Инструменты","Налоги и сборы","Субподряд","Административные","Прочее"];
const INC_CATS = ["Акт КС-2 / АВР","Аванс от заказчика","Возврат депозита","Прочие поступления"];

let state = loadState();
let currentTab = 'dashboard';
let filterObj = 'all';

function defaultState() {
  return {
    objects: [
      { id:'obj1', name:'Объект А — ЖК Алатау',    gc:'ТОО «BI Group»',       contract:'БИ-2025-011' },
      { id:'obj2', name:'Объект Б — БЦ Нурлы жол', gc:'ТОО «RAMS Qazaqstan»', contract:'РМС-25-07'   },
    ],
    entries: [
      { id:1,  date:'2025-01-10', type:'Взнос',    obj:'-', cat:'Взнос партнёра',    who:'Дмитрий',  amount:600000, note:'Стартовый взнос', doc:'' },
      { id:2,  date:'2025-01-10', type:'Взнос',    obj:'-', cat:'Взнос партнёра',    who:'Бекжан',   amount:600000, note:'Стартовый взнос', doc:'' },
      { id:3,  date:'2025-01-10', type:'Взнос',    obj:'-', cat:'Взнос партнёра',    who:'Евгений',  amount:600000, note:'Стартовый взнос', doc:'' },
      { id:4,  date:'2025-01-10', type:'Взнос',    obj:'-', cat:'Взнос партнёра',    who:'Нурсултан',amount:600000, note:'Стартовый взнос', doc:'' },
      { id:5,  date:'2025-01-10', type:'Взнос',    obj:'-', cat:'Взнос партнёра',    who:'Сергей',   amount:600000, note:'Стартовый взнос', doc:'' },
      { id:6,  date:'2025-01-20', type:'Расход',   obj:'obj1', cat:'Материалы',      who:'Поставщик ТМЦ',    amount:480000, note:'Арматура А500С Ø12, 8 тн', doc:'Сч-0112' },
      { id:7,  date:'2025-01-25', type:'Расход',   obj:'obj1', cat:'Зарплата рабочих',who:'Бригада монолит', amount:320000, note:'Зарплата январь', doc:'' },
      { id:8,  date:'2025-02-03', type:'Расход',   obj:'obj2', cat:'Аренда техники', who:'ТОО Техника KZ',   amount:210000, note:'Автокран 25т, 3 дня', doc:'Акт-0201' },
      { id:9,  date:'2025-02-05', type:'Доход',    obj:'obj1', cat:'Акт КС-2 / АВР', who:'ТОО «BI Group»',  amount:1200000,note:'КС-2 №1 монолит колонны', doc:'КС2-001' },
      { id:10, date:'2025-02-10', type:'Расход',   obj:'obj1', cat:'Транспорт',       who:'ИП Иванов',        amount:45000,  note:'Доставка опалубки', doc:'' },
      { id:11, date:'2025-02-20', type:'Расход',   obj:'obj2', cat:'Материалы',       who:'Бетонный завод №2',amount:390000, note:'Бетон В25 П3, 50 м³', doc:'Сч-0219' },
      { id:12, date:'2025-02-28', type:'Доход',    obj:'obj2', cat:'Аванс от заказчика',who:'ТОО «RAMS Qazaqstan»',amount:900000,note:'Аванс 30%', doc:'АВ-001' },
      { id:13, date:'2025-03-01', type:'Расход',   obj:'obj1', cat:'ФОТ ИТР',         who:'Прораб Петров А.', amount:150000, note:'Зарплата прораба февраль', doc:'' },
      { id:14, date:'2025-03-01', type:'Изъятие',  obj:'-', cat:'Изъятие партнёра',  who:'Дмитрий',           amount:100000, note:'Аванс на личные нужды', doc:'' },
      { id:15, date:'2025-03-05', type:'Изъятие',  obj:'-', cat:'Изъятие партнёра',  who:'Бекжан',            amount:100000, note:'Аванс на личные нужды', doc:'' },
      { id:16, date:'2025-03-10', type:'Доход',    obj:'obj1', cat:'Акт КС-2 / АВР', who:'ТОО «BI Group»',   amount:850000, note:'КС-2 №2 монолит перекрытия', doc:'КС2-002' },
    ]
  };
}

function loadState() {
  try { const s = localStorage.getItem('subcontract_v2'); return s ? JSON.parse(s) : defaultState(); }
  catch { return defaultState(); }
}
function saveState() {
  try { localStorage.setItem('subcontract_v2', JSON.stringify(state)); } catch {}
}

// ══════════════════════════════════════════════════════
// COMPUTED
// ══════════════════════════════════════════════════════
function filtered() {
  if (filterObj === 'all') return state.entries;
  return state.entries.filter(e =>
    (e.type === 'Доход' || e.type === 'Расход') ? e.obj === filterObj : true
  );
}
function sum(arr, type)   { return arr.filter(e=>e.type===type).reduce((s,e)=>s+e.amount,0); }
function fmt(n)           { return new Intl.NumberFormat('ru').format(Math.abs(Math.round(n||0))); }
function fmtS(n)          { return (n<0?'−':'')+fmt(n)+' ₸'; }
function objName(id)      { const o=state.objects.find(x=>x.id===id); return o?o.name.split('—')[0].trim():'—'; }
function partnerColor(name){ return P_COLORS[PARTNERS.indexOf(name)] || '#8b949e'; }

function computeTotals(entries) {
  return {
    income:   sum(entries,'Доход'),
    expense:  sum(entries,'Расход'),
    contrib:  sum(entries,'Взнос'),
    withdraw: sum(entries,'Изъятие'),
    get profit(){ return this.income - this.expense; },
    get balance(){ return this.income - this.expense + this.contrib - this.withdraw; },
  };
}

// ══════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab)?.classList.add('active');
  render();
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render() {
  filterObj = document.getElementById('obj-filter')?.value || 'all';
  const entries = filtered();
  const T = computeTotals(entries);
  const allT = computeTotals(state.entries);
  const el = document.getElementById('content');

  // Update obj filter options
  const sel = document.getElementById('obj-filter');
  if (sel && sel.options.length === 1) {
    state.objects.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.id; opt.textContent = o.name.split('—')[0].trim();
      sel.appendChild(opt);
    });
  }

  if (currentTab === 'dashboard')  el.innerHTML = renderDashboard(entries, T, allT);
  if (currentTab === 'cashflow')   el.innerHTML = renderCashflow(entries);
  if (currentTab === 'objects')    el.innerHTML = renderObjects();
  if (currentTab === 'partners')   el.innerHTML = renderPartners(allT);
  if (currentTab === 'journal')    el.innerHTML = renderJournal(entries);
}

function badge(type) {
  const map = {
    'Доход':    ['var(--green)', 'var(--green-lt)'],
    'Расход':   ['var(--red)',   'var(--red-lt)'],
    'Взнос':    ['var(--blue)',  'var(--blue-lt)'],
    'Изъятие':  ['var(--purple)','var(--purple-lt)'],
  };
  const [c,bg] = map[type]||['var(--muted)','var(--surface2)'];
  return `<span class="badge" style="color:${c};background:${bg}">${type}</span>`;
}

// ── DASHBOARD ──
function renderDashboard(entries, T, allT) {
  const profit = T.income - T.expense;
  const profitColor = profit >= 0 ? 'var(--green)' : 'var(--red)';

  // Expense by category
  const catMap = {};
  entries.filter(e=>e.type==='Расход').forEach(e=>{ catMap[e.cat]=(catMap[e.cat]||0)+e.amount; });
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCat = cats[0]?.[1]||1;

  // Recent
  const recent = [...entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);

  return `
  <div class="kpi-grid">
    <div class="kpi" style="border-left-color:var(--green)">
      <div class="kpi-label">Доходы</div>
      <div class="kpi-value" style="color:var(--green)">${fmt(T.income)}</div>
      <div class="kpi-sub">₸</div>
    </div>
    <div class="kpi" style="border-left-color:var(--red)">
      <div class="kpi-label">Расходы</div>
      <div class="kpi-value" style="color:var(--red)">${fmt(T.expense)}</div>
      <div class="kpi-sub">₸</div>
    </div>
    <div class="kpi" style="border-left-color:${profitColor}">
      <div class="kpi-label">Прибыль</div>
      <div class="kpi-value" style="color:${profitColor}">${fmt(profit)}</div>
      <div class="kpi-sub">${profit>=0?'▲ положительная':'▼ убыток'}</div>
    </div>
    <div class="kpi" style="border-left-color:var(--gold)">
      <div class="kpi-label">Доля / партнёр</div>
      <div class="kpi-value" style="color:var(--gold)">${fmt(profit/5)}</div>
      <div class="kpi-sub">₸ каждому</div>
    </div>
    <div class="kpi" style="border-left-color:var(--blue)">
      <div class="kpi-label">Капитал</div>
      <div class="kpi-value" style="color:var(--blue)">${fmt(allT.contrib)}</div>
      <div class="kpi-sub">взносы партнёров</div>
    </div>
    <div class="kpi" style="border-left-color:var(--purple)">
      <div class="kpi-label">Изъятия</div>
      <div class="kpi-value" style="color:var(--purple)">${fmt(allT.withdraw)}</div>
      <div class="kpi-sub">₸ выведено</div>
    </div>
  </div>

  ${cats.length ? `
  <div class="card">
    <div class="card-title">Расходы по категориям</div>
    ${cats.map(([cat,val])=>`
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
          <span style="color:var(--muted)">${cat}</span>
          <span style="color:var(--red);font-weight:700">${fmt(val)} ₸</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${(val/maxCat*100).toFixed(1)}%;background:var(--red)"></div></div>
      </div>
    `).join('')}
  </div>` : ''}

  <div class="card">
    <div class="card-title">Последние операции</div>
    ${recent.length ? recent.map(e=>`
      <div class="cf-row">
        <div class="cf-icon">${e.type==='Доход'?'▲':e.type==='Расход'?'▼':e.type==='Взнос'?'↗':'↙'}</div>
        <div class="cf-body">
          <div class="cf-desc">${e.note||e.cat}</div>
          <div class="cf-meta">${e.date} · ${e.who}</div>
        </div>
        <div class="cf-amount" style="color:${e.type==='Доход'||e.type==='Взнос'?'var(--green)':'var(--red)'}">
          ${e.type==='Доход'||e.type==='Взнос'?'+':'-'}${fmt(e.amount)} ₸
        </div>
      </div>
    `).join('') : '<div class="empty"><div class="empty-icon">📋</div>Нет операций</div>'}
  </div>`;
}

// ── CASH FLOW ──
function renderCashflow(entries) {
  const sorted = [...state.entries].sort((a,b)=>a.date.localeCompare(b.date));
  let running = 0;
  const rows = sorted.map(e => {
    const sign = (e.type==='Доход'||e.type==='Взнос') ? 1 : -1;
    running += sign * e.amount;
    return { ...e, sign, running };
  }).reverse();

  return `
  <div class="section-hdr">
    <h2>ДВИЖЕНИЕ</h2>
    <span class="section-total" style="color:${running>=0?'var(--green)':'var(--red)'}">
      остаток: ${fmt(running)} ₸
    </span>
  </div>
  <div class="card">
    ${rows.map(e=>`
      <div class="cf-row">
        <div class="cf-icon" style="color:${e.sign>0?'var(--green)':'var(--red)'}">
          ${e.sign>0?'▲':'▼'}
        </div>
        <div class="cf-body">
          <div class="cf-desc">${e.note||e.cat} ${e.doc?`<span style="color:var(--muted);font-size:9px">${e.doc}</span>`:''}</div>
          <div class="cf-meta">${e.date} · ${badge(e.type)} · ${e.who}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="cf-amount" style="color:${e.sign>0?'var(--green)':'var(--red)'}">
            ${e.sign>0?'+':'-'}${fmt(e.amount)} ₸
          </div>
          <div style="font-size:9px;color:${e.running>=0?'var(--muted)':'var(--red)'}">
            ост: ${fmt(e.running)} ₸
          </div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

// ── OBJECTS ──
function renderObjects() {
  return `
  <div class="section-hdr">
    <h2>ОБЪЕКТЫ</h2>
    <button class="del-btn" onclick="openObjectModal()" style="color:var(--gold);border-color:var(--gold)">+ Объект</button>
  </div>
  ${state.objects.map(obj => {
    const inc  = state.entries.filter(e=>e.type==='Доход'&&e.obj===obj.id).reduce((s,e)=>s+e.amount,0);
    const exp  = state.entries.filter(e=>e.type==='Расход'&&e.obj===obj.id).reduce((s,e)=>s+e.amount,0);
    const pr   = inc - exp;
    const catMap = {};
    state.entries.filter(e=>e.type==='Расход'&&e.obj===obj.id).forEach(e=>{ catMap[e.cat]=(catMap[e.cat]||0)+e.amount; });
    const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
    return `
    <div class="obj-card">
      <div class="obj-header">
        <div class="obj-name">${obj.name}</div>
        <div class="obj-meta">${obj.gc} · ${obj.contract}</div>
      </div>
      <div class="obj-kpis">
        <div class="obj-kpi"><div class="obj-kpi-lbl">Доходы</div><div class="obj-kpi-val" style="color:var(--green)">${fmt(inc)}</div></div>
        <div class="obj-kpi"><div class="obj-kpi-lbl">Расходы</div><div class="obj-kpi-val" style="color:var(--red)">${fmt(exp)}</div></div>
        <div class="obj-kpi"><div class="obj-kpi-lbl">Прибыль</div><div class="obj-kpi-val" style="color:${pr>=0?'var(--gold)':'var(--red)'}">${fmt(pr)}</div></div>
      </div>
      ${cats.length?`
      <div class="obj-cats">
        ${cats.slice(0,6).map(([c,v])=>`
          <div class="obj-cat-row"><span>${c}</span><span>${fmt(v)} ₸</span></div>
        `).join('')}
      </div>`:''}
    </div>`;
  }).join('')}`;
}

// ── PARTNERS ──
function renderPartners(allT) {
  const profit = allT.income - allT.expense;
  const shareEach = profit / 5;

  return `
  <div class="section-hdr">
    <h2>ПАРТНЁРЫ</h2>
    <div class="section-total" style="color:var(--gold)">доля: ${fmt(shareEach)} ₸</div>
  </div>
  <div class="partner-grid">
    ${PARTNERS.map((p,i) => {
      const contrib  = state.entries.filter(e=>e.type==='Взнос'&&e.who===p).reduce((s,e)=>s+e.amount,0);
      const withdraw = state.entries.filter(e=>e.type==='Изъятие'&&e.who===p).reduce((s,e)=>s+e.amount,0);
      const netto = contrib - withdraw;
      return `
      <div class="partner-card" style="border-top-color:${P_COLORS[i]}">
        <div class="partner-name" style="color:${P_COLORS[i]}">${p}</div>
        <div class="partner-row"><span class="partner-lbl">Взносы</span><span style="color:var(--blue)">${fmt(contrib)} ₸</span></div>
        <div class="partner-row"><span class="partner-lbl">Изъятия</span><span style="color:var(--red)">${fmt(withdraw)} ₸</span></div>
        <div class="partner-divider"></div>
        <div class="partner-row"><span class="partner-lbl">Нетто</span><span style="color:${netto>=0?'var(--green)':'var(--red)'}">${fmt(netto)} ₸</span></div>
        <div class="partner-row"><span class="partner-lbl">Прибыль</span><span style="color:var(--gold)">${fmt(shareEach)} ₸</span></div>
      </div>`;
    }).join('')}
  </div>

  <div style="margin-top:12px">
    <div class="section-hdr"><h2>ИСТОРИЯ</h2></div>
    <div class="card">
      ${state.entries.filter(e=>e.type==='Взнос'||e.type==='Изъятие')
        .sort((a,b)=>b.date.localeCompare(a.date))
        .map(e=>`
        <div class="cf-row">
          ${badge(e.type)}
          <div class="cf-body">
            <div class="cf-desc" style="color:${partnerColor(e.who)}">${e.who}</div>
            <div class="cf-meta">${e.date} · ${e.note}</div>
          </div>
          <div class="cf-amount" style="color:${e.type==='Взнос'?'var(--blue)':'var(--purple)'}">
            ${e.type==='Взнос'?'+':'-'}${fmt(e.amount)} ₸
          </div>
          <button class="del-btn" onclick="delEntry(${e.id})">✕</button>
        </div>
      `).join('')}
    </div>
  </div>`;
}

// ── JOURNAL ──
function renderJournal(entries) {
  const sorted = [...entries].sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="section-hdr">
    <h2>ЖУРНАЛ</h2>
    <span class="section-total">${sorted.length} записей</span>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    ${sorted.length ? sorted.map(e=>`
      <div style="padding:10px 12px;border-bottom:1px solid var(--surface2);display:flex;gap:8px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap">
            ${badge(e.type)}
            <span style="font-size:9px;color:var(--muted)">${e.date}</span>
            ${e.obj&&e.obj!=='-'?`<span style="font-size:9px;color:var(--muted)">${objName(e.obj)}</span>`:''}
          </div>
          <div style="font-size:12px;margin-bottom:2px">${e.note||e.cat}</div>
          <div style="font-size:10px;color:var(--muted)">${e.who} ${e.doc?'· '+e.doc:''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:13px;font-weight:700;color:${e.type==='Доход'||e.type==='Взнос'?'var(--green)':'var(--red)'}">
            ${e.type==='Доход'||e.type==='Взнос'?'+':'-'}${fmt(e.amount)} ₸
          </div>
          <button class="del-btn" style="margin-top:4px" onclick="delEntry(${e.id})">✕</button>
        </div>
      </div>
    `).join('') : '<div class="empty"><div class="empty-icon">📋</div>Нет записей</div>'}
  </div>`;
}

// ══════════════════════════════════════════════════════
// MODAL — ADD ENTRY
// ══════════════════════════════════════════════════════
let currentType = 'Расход';

function openModal(prefillType) {
  currentType = prefillType || 'Расход';
  document.getElementById('modal-title').textContent = 'НОВАЯ ЗАПИСЬ';
  renderModalBody();
  document.getElementById('modal').style.display = 'flex';
}

function renderModalBody() {
  const today = new Date().toISOString().slice(0,10);
  const typeBtns = ['Доход','Расход','Взнос','Изъятие'].map(t => {
    const cls = t===currentType ? `selected-${t==='Доход'?'income':t==='Расход'?'expense':t==='Взнос'?'contrib':'withdraw'}` : '';
    return `<button class="type-btn ${cls}" onclick="selectType('${t}')">${t}</button>`;
  }).join('');

  const isTransfer = currentType==='Взнос'||currentType==='Изъятие';
  const objOpts = state.objects.map(o=>`<option value="${o.id}">${o.name.split('—')[0].trim()}</option>`).join('');
  const expOpts = EXP_CATS.map(c=>`<option>${c}</option>`).join('');
  const incOpts = INC_CATS.map(c=>`<option>${c}</option>`).join('');
  const parOpts = PARTNERS.map(p=>`<option>${p}</option>`).join('');

  document.getElementById('modal-body').innerHTML = `
    <div class="type-grid">${typeBtns}</div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Дата</label>
        <input class="form-input" type="date" id="f-date" value="${today}"/>
      </div>
      <div class="form-group">
        <label class="form-label">Сумма (₸)</label>
        <input class="form-input" type="number" id="f-amount" placeholder="0" inputmode="numeric"/>
      </div>
    </div>

    ${!isTransfer ? `
    <div class="form-group">
      <label class="form-label">Объект</label>
      <select class="form-input" id="f-obj">${objOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Категория</label>
      <select class="form-input" id="f-cat">${currentType==='Доход'?incOpts:expOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Контрагент</label>
      <input class="form-input" type="text" id="f-who" placeholder="ТОО «...» или ИП..."/>
    </div>` : `
    <div class="form-group">
      <label class="form-label">Партнёр</label>
      <select class="form-input" id="f-who">${parOpts}</select>
    </div>`}

    <div class="form-group">
      <label class="form-label">Примечание</label>
      <input class="form-input" type="text" id="f-note" placeholder="Описание операции..."/>
    </div>
    <div class="form-group">
      <label class="form-label">Счёт / Акт / Документ</label>
      <input class="form-input" type="text" id="f-doc" placeholder="КС2-001, Сч-0001..."/>
    </div>

    <button class="btn-save" onclick="saveEntry()">СОХРАНИТЬ</button>
    <button class="btn-cancel" onclick="closeModal()">Отмена</button>
  `;
}

function selectType(t) {
  currentType = t;
  renderModalBody();
}

function saveEntry() {
  const amount = parseFloat(document.getElementById('f-amount')?.value);
  if (!amount || isNaN(amount)) { alert('Введите сумму'); return; }
  const isTransfer = currentType==='Взнос'||currentType==='Изъятие';
  const who = document.getElementById('f-who')?.value || '';
  const entry = {
    id: Date.now(),
    date:   document.getElementById('f-date')?.value || new Date().toISOString().slice(0,10),
    type:   currentType,
    obj:    isTransfer ? '-' : (document.getElementById('f-obj')?.value || '-'),
    cat:    isTransfer ? currentType+' партнёра' : (document.getElementById('f-cat')?.value || ''),
    who,
    amount,
    note:   document.getElementById('f-note')?.value || '',
    doc:    document.getElementById('f-doc')?.value  || '',
  };
  state.entries.push(entry);
  saveState();
  closeModal();
  render();
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function openObjectModal() {
  document.getElementById('modal-title').textContent = 'НОВЫЙ ОБЪЕКТ';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">Название объекта</label>
      <input class="form-input" type="text" id="f-obj-name" placeholder="ЖК Алатау, корпус 3..."/>
    </div>
    <div class="form-group">
      <label class="form-label">Заказчик (ГП)</label>
      <input class="form-input" type="text" id="f-obj-gc" placeholder="ТОО «BI Group»"/>
    </div>
    <div class="form-group">
      <label class="form-label">Номер договора</label>
      <input class="form-input" type="text" id="f-obj-contract" placeholder="БИ-2025-001"/>
    </div>
    <button class="btn-save" onclick="saveObject()">СОХРАНИТЬ</button>
    <button class="btn-cancel" onclick="closeModal()">Отмена</button>
  `;
  document.getElementById('modal').style.display = 'flex';
}

function saveObject() {
  const name = document.getElementById('f-obj-name')?.value.trim();
  if (!name) { alert('Введите название'); return; }
  const obj = {
    id: 'obj' + Date.now(),
    name,
    gc:       document.getElementById('f-obj-gc')?.value || '',
    contract: document.getElementById('f-obj-contract')?.value || '',
  };
  state.objects.push(obj);
  // Add to filter
  const sel = document.getElementById('obj-filter');
  const opt = document.createElement('option');
  opt.value = obj.id; opt.textContent = name.split('—')[0].trim();
  sel.appendChild(opt);
  saveState();
  closeModal();
  render();
}

function delEntry(id) {
  if (!confirm('Удалить запись?')) return;
  state.entries = state.entries.filter(e=>e.id!==id);
  saveState(); render();
}

// ══════════════════════════════════════════════════════
// PWA / SERVICE WORKER
// ══════════════════════════════════════════════════════
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
render();
</script>
</body>
</html>
